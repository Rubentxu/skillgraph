        hacia el lado de mentir: leer [CERRADO ] con espacio donde B6 lo escribe sin el y devolver
        PASS sobre cero preguntas; buscar «deselected» para saber que no se ejecuto nada; llamar a
        construir_parser() cuando es build_parser() y comerse el ImportError en un return (); y
