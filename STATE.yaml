  h9_bslice4_context_controller_delta: "+15 tests H9-BSlice4 (ADR-0014): 4 tests list_claims_by_predicate (contrato, aislamiento, no-match, columnas) + 3 tests list_evidences_for_source (contrato, no-match, columnas) + 6 tests list_resource_refs_for_run (kind=claim, kind=evidence, DISTINCT+ORDER, aislamiento run_id, no-events, kind invalido) + 2 tests no-regresion por introspeccion (ContextController sin _conn.execute; uso de los 3 metodos publicos). Cierra los 4 sitios SQL directos (lineas 297-303, 346-349, 402-410, 413-421). Spec: specs/h9-coverage-context-controller.md."
