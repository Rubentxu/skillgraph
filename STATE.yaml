  rationale_b7: >-
      BLOQUE B7 — UX operacional, cerrado y verificado. SemVer DERIVADO con
      scripts/derive_semver.py: desde v0.26.0, b/f/x/n/d 0/1/1/2/0, la regla
      pide MINOR -> v0.27.0. Ningun commit con marcador de ruptura. LO QUE
      ENTREGA: la capa de presentacion de la que dependia la TUI. MEDIDO antes
      de escribir nada con scripts/measure_b7_operational_ux.py: 3 de 3
      preguntas ABIERTAS, y el hueco no era que faltara una TUI sino la pieza
      de la que la TUI depende — cero declaraciones de --format en siete
      modulos de comando, y ningun simbolo en src/ que expusiera render, luego
      la palabra cargada del gate, «las MISMAS APIs y query models», no tenia
      a que referirse. CERRADO con src/skillgraph/presentation/ (views.py con
      Column, TableView y DetailView; widgets.py con las DIEZ proyeciones
      puras) y --format {text,json} en runs list y runs show sobre un unico
      _emit. TRES DECISIONES. (1) Las vistas NO leen disco: se construyen
      desde lo que el dominio ya devolvio, porque una vista que consulta
      seria una segunda via de consulta, que es el duplicado que este bloque
      existe para impedir; se comprueba por AST, cero imports de sqlite3 y de
      Storage. (2) Una sola vista, dos representaciones, leyendo los MISMOS
      campos, para que no puedan divergir — y aqui se distinguio algo que la
      primera version del test confundia: «mismos campos» NO es «mismo
      renderizado». Un vacio se imprime como «-» en texto, que es el contrato
      antiguo de runs show, y como [] en JSON, que es lo que una maquina
      necesita para no tener que adivinar si es vacio o la cadena «-».
      Exigir que coincidieran habria obligado a romper uno de los dos. (3) B7
      ANADE representaciones, NO sustituye: sin --format, runs show sigue
      siendo clave=valor, porque hay callers que lo leen con cut -d= -f2 y
      su docstring lo promete. Y MEDIDO CONTRA, que es lo que hace el
      bloque creible: el guard que vigila (3) no es teorico. La primera
      version de _emit pasaba vacio= a toda vista; TableView lo acepta,
      DetailView no, y runs show —el camino de TEXTO, el de por defecto, el
      que se usa siempre que nadie pasa --format— salia con TypeError. Un
      test que mira la vista NO lo ve, porque el defecto estaba en el
      cableado entre el comando y la vista: hay que ejecutar el comando, y
      por eso TestB7NoRompeElContratoExterno va por subprocess. CONTRA-
      SALTOS 3/3, cada uno con su propia causa, y M3 la cazo un guard NUEVO
      (test_list_sigue_diciendo_sin_runs) y no uno preexistente: sin el,
      quitarle a runs list su (sin runs) propio no ponia nada en rojo. Un
      cuarto agujero, del propio instrumento: el contra-salto del medidor
      copiaba el repo entero a /tmp y se ponia rojo con EDQUOT al escribir
      cientos de MB — un guard que se pone rojo porque se lleno el disco no
      mide la propiedad, mide el almacenamiento; ahora copia solo src/ y
      scripts/, 1,1 MB, y discrimina igual. CERTIFICACION: 3085 passed, 3
      skipped declarados, 0 failed. tests.total 3088, con el desglose
      MEDIDO y no estimado: sin el paquete presentation en el arbol la suite
      colecta 3055, la cifra exacta que B6 declaro, y al devolverlo colecta
      3088; los 10 que no son de B7 los genera wi47 al aparecer los modulos
      nuevos. Es la prediccion que B6 dejo escrita y que es facil leer al
      reves. FUERA DE ALCANCE Y REGISTRADO: P4, que la TUI sea usable de
      verdad, porque depende de un terminal y de un humano que el CI no
      tiene; el medidor la deja registrada y por eso NO baja el veredicto.
      HALLAZGO FUERA DEL BLOQUE, con efecto real: el ciclo b6 llevaba dos
      sesiones bloqueado en explore por un supuesto defecto del framework
      (sddk artifact store no vinculaba el artefacto al ciclo), y NO lo era:
      cycle transition acepta --artifact kind=path EN LA PROPIA TRANSICION.
      Con esa via la transicion se aplica y b6 quedo desbloqueado. Un
      ENGINE_MISSING_ARTIFACT que NOMBRA el artefacto que falta es una
      instruccion, no un veredicto de averia. Evidencia:
      scripts/measure_b7_operational_ux.py y
      scripts/mutate_b7_operational_ux.py.
  rationale_b9: >-
      BLOQUE B9 — El gate de 1.0 deja de ser una lista en prosa, cerrado.
      SemVer DERIVADO con scripts/derive_semver.py desde v0.28.0:
      b/f/x/n/d 0/0/2/6/0, la regla pide PATCH -> v0.28.1. Y CONTRADICE LO
      QUE UNO ESPERARIA, asi que queda dicho aqui: el bloque entrega un
      modulo NUEVO —src/skillgraph/platform/journal.py— y un instrumento
      nuevo, y aun asi la regla lee PATCH. No es que la regla falle: es que
      ese modulo via en un commit `fix(platform)` porque el cambio
      dominante era cerrar un defecto de produccion. El SemVer lo deriva de
      los TIPOS de commit, no de su tamano, y esa es la regla del repo. Si
      el bloque se hubiera partido en dos commits, uno `feat` y otro `fix`,
      la misma cantidad de trabajo habria salido MINOR. Se deja escrito
      para que el proximo que lea «B9 fue un PATCH» sepa que fue una
      consecuencia de COMO se commiteo, no de lo que entrego. MEDIDO con
      scripts/measure_b9_gate_1_0.py, que DERIVA las veinte propiedades del
      propio ROADMAP.md y ejecuta un predicado por cada una: 13 PASS, 6 OPEN,
      1 NO_MEASURABLE, 0 NO_MEDIBLE, listo_para_1_0 false. LO QUE DESTAPO NO
      ERA UN NUMERO: al medir «concurrencia real certificada» salio OPEN, y
      en detalle 3 de 8 hijos muerios con 50 de 80 filas. El defecto de
      produccion era el que B2 abrio y no cerro: `PRAGMA journal_mode =
      WAL` en cada apertura es idempotente y aun asi TOMA UN LOCK DE
      ESCRITURA para averiguar que no hace nada. B2 lo arreglo con un
      reintento y el reintento no bastaba, porque journal_mode NO honra el
      busy_timeout del connect. CERRADO preguntando el modo antes de
      cambiarlo —una lectura, que no pide el lock—, releendo entre reintentos
      y durmiendo entre ellos. MEDIDO con el escenario que antes fallaba:
      40 rondas de ocho procesos abriendo una base nueva a la vez, sin un
      fallo. Y la segunda mitad: lanzar ocho procesos en un bucle no los
      hace competir, luego los hijos ahora esperan en una puerta que el
      padre no abre hasta tenerlos a todos —0 de 20 y 0 de 25, donde antes
      eran 4 de 20—. CUATRO BUGS DEL PROPIO MEDIDOR, todos hacia el lado de
      mentir: leer `[CERRADO ]` con espacio donde B6 lo escribe sin el, y
      devolver PASS sobre cero preguntas; buscar «deselected» para saber que
      no se ejecuto nada; llamar a construir_parser() cuando es
      build_parser() y comerse el ImportError en un return (); y contar como
      abierta la P6 de B5, que declara FUERA DE ALCANCE. HARNESS 6/6 con 6
      causas distintas, y tres de las seis salidas fueron fallos de los
      GUARDS, no de las sondas: uno miraba que el proceso siguiera vivo,
      otro hacia join() del hilo antes de comprobar, y el tercero decia «ha
      salido un error» queriendo decir «ha salido ESTE error», porque con el
      error tragado la excepcion igualmente salia de _migrate(). Y EL HARNESS
      SE DESTRUYO A SI MISMO: restauraba con `git checkout --`, que restaura
      DEL INDICE, y con el arreglo sin commitear se llevo el arreglo entero y
      las cinco sondas siguientes se quedaron sin texto que deformar — lo
      peor es que PARECIA funcionar, con la base verde y la primera sonda
      cazada. «Restaurar» y «borrar» son la misma operacion si no hay commit
      debajo, y por eso ahora se niega a empezar si encuentra cambios sin
      commitear en lo que va a restaurar.
  rationale_b8: >-
      BLOQUE B8 — EL CONTRATO DE PAQUETE, cerrado y verificado. SemVer
      DERIVADO con scripts/derive_semver.py: desde v0.27.0, b/f/x/n/d
      0/1/0/5/0, la regla pide MINOR -> v0.28.0. Ningun commit con marcador
      de ruptura. LA DECISION DEL BLOQUE: el enunciado de B8 enumera SIETE
      frentes —seis tipos de paquete, aislamiento progresivo,
      mise/asdf/uv tool/PyPI, upgrade, install/update/remove, matriz de
      compatibilidad y el formato requires—, y siete no es un bloque, son
      siete. Este mide y entrega EL MANIFIESTO, que es la pieza de la que
      los otros seis cuelgan: sin requires no hay version que comparar, sin
      un contrato versionado no hay upgrade, y sin contrato no hay
      install/update/remove que valga como algo mas que copiar ficheros.
      MEDIDO antes de escribir nada con scripts/measure_b8_package_contract.py:
      5 de 5 preguntas ABIERTAS. Y lo que encuentra no es que falte un
      campo: lo que existe es un Brick con kind="DomainPack", que es el
      contrato de TIPOS, no el de PAQUETE. LA COSTURA YA ESTABA PUESTA DESDE
      B3, con un docstring que decia literalmente que CAPABILITY_VERSION
      estaba ahi 'para que requires.capabilities de B8 tenga algo que
      versionar': este bloque no invento el requisito, lo ejecuto. TRES
      DECISIONES. (1) PACK_KINDS se DERIVA por get_args, nunca se escribe a
      mano —un conjunto literal se queda corto en cuanto el Literal crece y
      entonces el validador rechaza el valor nuevo que el propio tipo acepta,
      que es el error de QW-E pagado en B6—. (2) La version de la
      capability la hereda del PUERTO, que es lo que B3 dejo anotado. (3)
      ISOLATION_LEVELS es una tupla ORDENADA y no un conjunto: el orden es
      el contenido, y es lo que convierte 'progresivo' en una propiedad
      comprobable con es_al_menos y no en un adjetivo. Y es_compatible
      devuelve MOTIVOS y no un bool, porque en un pack que se esta instalando
      el 'por que' es la mitad del trabajo: 'no encaja' no le dice al
      operador si le falta una capability o si su SkillGraph es viejo. DOS
      DEFECTOS REALES DEL CODIGO, cazados por los tests. (1) EL PARSER
      RECHAZABA EL FORMATO DEL PROPIO GATE: el enunciado escribe '>=0.30,<1',
      que MEZCLA '>=0.30' —dos componentes— y '<1' —uno solo—, y la regex
      exigia X.Y o SemVer completo, luego NINGUN pack encajaba contra el
      formato que el gate define; lo cazaron seis tests a la vez. (2) LA
      CAPABILITY LARGA SE ROMPIA EN SILENCIO: {type_name, version}
      producia type_name='a.b.v2@v2' con la version pegada y la del puerto
      en el campo version, que no se puede comparar con un CapabilitySpec
      instalado y cuyo sintoma es 'falta la capability', una respuesta
      CREIBLE. Y TRES DEFECTOS PROPIOS, que tambien importan porque un
      guard que miente es peor que un guard que falta. (1) UN PYTEST.SKIP
      MIO que escondia un fallo del contrato —lo que AGENTS 6.2 prohibe y lo
      que test_wi108_zero_skips.py caza—; lo grave no era el skip, es que
      estaba porque la asercion de verdad nunca se escribio y en su lugar se
      puso un guard que salta justo cuando la propiedad se rompe. (2) UN
      TEST QUE NO PODIA FALLAR: mutar requires.skillgraph en el dict de
      origen no puede cambiar un frozen dataclass porque los strings son
      inmutables, luego era verde por construccion; la sonda M5 salio
      NO CAZADA —el harness diciendo la verdad en vez de contar un 5/5
      falso— y se movio a metadatos, donde el alias si es posible. (3)
      'ARBOL RESTAURADO BYTE A BYTE' NO ES 'EL ARBOL ESTA COMO ESTABA': al
      restaurar, el mtime puede no avanzar y Python sigue ejecutando el pyc
      de la version mutada, luego el arbol estaba restaurado y ejecutando la
      version equivocada A LA VEZ; se vio porque M5 cazaba los tests de M4.
      El harness ahora borra __pycache__ y VUELVE A PASAR LA SUITE al
      final, que es la comprobacion que faltaba. Y dos bugs del MEDIDOR,
      corregidos ANTES de escribir produccion: literal_eval no lee
      frozenset(get_args(X)), que es la forma correcta de declarar el
      conjunto, y el indice de alias no veia 'X = Literal[...]' sin
      anotacion, que es un Assign a secas. Un guard que obliga a escribir
      peor para poder ser medido es el peor resultado posible. VERIFICACION:
      3158 passed, 3 skips declarados, 0 failed; 66 tests; cobertura del
      100% del paquete nuevo, cuando el suelo de AGENTS 6.3 es 90%;
      contrasaltos 5/5 con 5 conjuntos DISTINTOS de tests, 0 sin sonda, y
      arbol restaurado byte a byte Y EJECUTANDO como estaba. tests.total
      3161, con el desglose MEDIDO pieza a pieza: sin el paquete packaging la
      suite colecta 3088 —la cifra exacta que B7 declaro, por tercera vez— y
      al devolverlo colecta 3161; los 73 son 66 propios, 6 de wi47 y 1 de
      WI-107. FLaky MEDIDO y NO OCULTADO: la primera certificacion dio 1
      failed en test_b2_real_concurrency::test_los_hijos_tienen_solape_en_el
      _tiempo, que depende del planificador del SO; medido 5/5 aislado, 8/8
      bajo carga de CPU, y la suite completa en verde al repetirla. Es
      deuda preexistente de B2 y sin relacion con este bloque. P6 —que un
      pack se instale de verdad en una instalacion real— queda FUERA y
      registrada: depende de un registro remoto y de una politica de fijacion
      que el CI no tiene. Y 'subprocess' y 'sandbox' son campos DECLARADOS, no
      mecanismos: declararlos sin ejecutarlos es la forma mas facil de
      mentir sobre seguridad. Evidencia: scripts/measure_b8_package_contract.py
      y scripts/mutate_b8_package_contract.py.
