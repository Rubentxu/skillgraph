    - tag: v0.28.0
      fecha: 2026-10-04
      sha: "cdc45475c19487368e34922b448ebe334da57740"
      nota: >-
        B8 cerrado: el contrato de paquete, y lo que de el depende. El enunciado de B8 enumera SIETE
        frentes y este es el primero, porque es el de la que los otros seis cuelgan: sin requires no hay
        version que comparar, sin un contrato versionado no hay upgrade, y sin contrato no hay
        install/update/remove que valga como algo mas que copiar ficheros. MEDIDO antes de escribir nada
        (scripts/measure_b8_package_contract.py): 5 de 5 preguntas abiertas, y lo que encuentra no es que
        falte un campo —lo que existe es un Brick con kind=DomainPack, que es el contrato de TIPOS, no el
        de PAQUETE—. LA COSTURA YA ESTABA PUESTA DESDE B3: CAPABILITY_VERSION vive en el puerto con un
        docstring que decia que esta ahi para que requires.capabilities de B8 tenga algo que versionar. TRES
        DECISIONES: PACK_KINDS se DERIVA por get_args y nunca se escribe a mano (un conjunto literal se
        queda corto cuando el Literal crece y la validacion rechaza el valor nuevo que el tipo si acepta);
        la version de la capability la hereda del PUERTO; y ISOLATION_LEVELS es una tupla ORDENADA y no un
        conjunto, porque el orden es lo que convierte 'progresivo' en una propiedad comprobable con
        es_al_menos. Y es_compatible devuelve MOTIVOS y no un bool: en un pack que se esta instalando el
        'por que' es la mitad del trabajo. DOS DEFECTOS REALES DEL CODIGO: el parser rechazaba el FORMATO
        DEL PROPIO GATE (el enunciado escribe '>=0.30,<1', que MEZCLA '>=0.30' de dos componentes con '<1'
        de uno solo, luego NINGUN pack encajaba contra el formato que el gate define, y lo cazaron seis tests
        a la vez); y la capability larga se rompia en silencio, produciendo el type_name con la version
        pegada, que no se puede comparar con un CapabilitySpec instalado y cuyo sintoma es 'falta la
        capability', una respuesta CREIBLE. TRES DEFECTOS PROPIOS: un pytest.skip mio que escondia un fallo
        del contrato —lo grave no era el skip, es que estaba porque la asercion de verdad nunca se
