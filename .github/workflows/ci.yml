name: ci

# AGENTS.md, «CI Local Obligatorio»:
#
#   `pipelinek` es la fuente de verdad local. GitHub Actions, GitLab CI,
#   Jenkins o cualquier otro runner remoto **debe** invocar el mismo
#   `.pipeline.kts` desde el mismo checkout.
#
# WI-98: hasta entonces este workflow ejecutaba SU PROPIA receta
# (`mise run lint` + `pytest --cov`) y no `.pipeline.kts`. De los siete
# stages canonicos reproducia UNO, y los tres contratos exigibles
# (coverage-floors, package-build y el unit-tests con la receta de
# cobertura) no existian aqui. Con el mismo instrumento, la divergencia
# se ve en los numeros: `cli/commands/runs.py` media 39 % aqui frente a
# 87.96 % en la receta canonica, y `cli/support.py` 69 % — por debajo del
# suelo del 70 % que declara AGENTS.md §6.3. Este workflow podia dar
# VERDE un paquete que no cumplia su propio contrato.
#
# Ahora hay UN solo gate y es el de aqui. Si esto diverge de
# `.pipeline.kts`, no es este fichero el que se actualiza: se actualiza
# `.pipeline.kts`, y el stage `ci-parity` lo comprueba.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  canonical:
    runs-on: ubuntu-latest
    # La receta canonica tarda ~4 min (receta de cobertura) + los
    # contratos. 15 min era el techo de la version anterior, que hacia
    # una cuarta parte del trabajo.
    timeout-minutes: 25

    env:
      # Ubicacion explicita del cache uv (necesaria para actions/cache).
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      # `mise.toml` fija pipelinek como backend `github:` (no un binario
      # de un registro). Sin token, `jdx/mise-action` no puede bajarlo y
      # `mise exec -- pipelinek` resolveria el shim de asdf, que es OTRO
      # binario con la misma ruta de nombre. Es el mismo problema que
      # documenta `mise.toml` en local, resuelto en el remoto.
      MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          install: true

      - name: List installed tool versions
        run: mise list

      - name: Restore uv cache
        # Cache keyed by uv.lock + OS para que cualquier cambio de
        # dependencias invalide el cache. restore-keys cubre el caso
        # "cambio menor (e.g. version patch) que no afecta uv.lock".
        uses: actions/cache@v4
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
            uv-${{ runner.os }}-

      - name: Verificacion canonica
        # UN solo paso, y es el que manda. El `--rerun` no es opcional:
        # sin el, el motor reutiliza el veredicto cacheado por `cacheKey`
        # de compilacion del script y termina en SUCCESS sin ejecutar un
        # solo step. Ver AGENTS.md, «CI Local Obligatorio».
        #
        # `GITHUB_WORKSPACE` lo exporta el propio runner y es lo que
        # `.pipeline.kts` usa para resolver la raiz del checkout.
        run: >
          mise exec -- pipelinek run --rerun
          --db .pipelinek/db.sqlite
          --control-root .pipelinek/control
          .pipeline.kts

      - name: Export coverage (XML)
        # La receta canonica ya dejo `.coverage` COMBINADO y con los
        # subprocesos instrumentados (hook .pth de scripts/coverage.sh).
        # Esto solo cambia el formato; no vuelve a medir.
        #
        # OJO: esto no sustituye a la cobertura de la receta canonica.
        # `pytest --cov` directo mide 39 % en cli/commands/runs.py frente
        # al 87.96 % de la instrumentada, porque el CLI se ejecuta por
        # subproceso y sin el hook no se ve. Exportar desde el dato
        # combinado es correcto; volver a medir a mano no lo seria.
        if: always()
        run: mise exec -- uv run coverage xml -o coverage.xml

      - name: Upload coverage artifact
        # coverage.xml para consumo externo (Codecov, badges, etc.).
        # `if: always()` para que el artifact se suba incluso si el
        # pipeline fallo: un run rojo con su cobertura vale mas que un
        # run rojo sin ella.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

      - name: Minimize uv cache
        # Reduce tamano del cache antes de guardarlo.
        if: always()
        run: mise exec -- uv cache prune --ci

      - name: Lint summary
        if: always()
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Toolchain: $(mise current)" >> $GITHUB_STEP_SUMMARY
          echo "- Receta canonica: \`.pipeline.kts\` (\`ci-parity\` stage included)" >> $GITHUB_STEP_SUMMARY
          echo "- Verificacion canonica: ${{ steps.verificacion-canonica.outcome }}" >> $GITHUB_STEP_SUMMARY
