roadmap:
  current_stage: 7
  current_spike: null
  current_hito: H8-integracion-publica-cerrado  # ADR-0013: H7 original renumerado a H9
  next_milestone_gate: DT_PRE_PUSH_HOOK_cerrado  # Pre-push hook completo (suite completa pytest antes de push), 888/888 PASS, 9 tests nuevos
  current_workitem: B11   # BLOQUE VIVO. EL CICLO DE VIDA DE LOS PACKS, que era un nombre en un gate. B10 cerro las dos propiedades del gate de 1.0 abiertas por falta de CERTIFICACION y dejo el veredicto en 15 PASS / 4 OPEN / 1 NO_MEASURABLE. De las cuatro que quedan, DOS piden CODIGO y no certificacion, y esta es la primera: `pack/controller lifecycle`, cuyo predicado decia, textual, que `sg pack` expone ['import', 'load'] y no ['install', 'update', 'remove']. B8 entrego el CONTRATO —PackManifest, Requires, seis tipos, tres niveles de aislamiento, es_compatible con MOTIVOS— y su propio enunciado decia que sin contrato versionado no hay install/update/remove «que valga como algo mas que copiar ficheros». Faltaba la mitad: saber QUE hay instalado. MEDIDO antes de escribir una linea con scripts/measure_b11_pack_lifecycle.py: 5 de 5 preguntas ABIERTAS, y 5 PASS al final. EL INSTRUMENTO EJERECUTA la CLI en un proyecto de verdad en vez de mirar nombres, porque un predicado que comprueba tres nombres fijos dice «cumple» el dia que alguien escriba los tres en el parser sin que exista el ciclo entero. UN DEFECTO DE PRODUCCION, y es el que hacia el update IMPOSIBLE: MEDIDO, `upsert_resource` RECHAZA cambiar el `spec` bajo la misma identidad con IdentityConflictError —deliberado, es lo que hace un recurso inmutable—, y un update de pack es por definicion un spec distinto bajo la misma identidad. No es un bug heredado: es que UNA INSTALACION NO ES UN RECURSO. El recurso es el contenido del pack; la instalacion es el HECHO de que ese pack este vivo en este proyecto, y ese hecho tiene su propio ciclo. De ahi la tabla installed_packs y su repositorio propio, con el patron lazy+cacheado de ADR-0016/WI-56. Y retirar NO borra: MARCA la fila, porque un DELETE perderia la unica respuesta que existe a «¿este proyecto ha tenido alguna vez este pack?» y el unico sitio donde vive esa respuesta es la fila que se borra. HALLAZGO SOBRE UN FILTRO QUE NO FILTRA: list_resources construye su filtro de kind como `AND api_version || '/' || kind = ? OR kind = ?`, SIN parentesis, luego el OR se come el AND que lo precede; delegar el aislamiento ahi habria costado una fuga entre tenants, asi que se comprueba fila a fila y hay dos guards que lo verifican en las dos direcciones. HARNESS 6/6 con 6 causas distintas, y TRES DE SUS FALLOS FUERON DEL HARNESS, no del codigo, y se cuentan: (1) MUTABLES no incluia installed_packs_repository.py, luego esa sonda muto el fichero y no lo restauro —y el harness reporto «arbol restaurado» porque LA SUITE SEGUIA VERDE, que es el fallo de B9 repetido con otro disfraz y por eso el veredicto final mira ahora las DOS cosas: que la suite pase y que `git status` de los mutables este limpio—; (2) la sonda M5 apuntaba al filtro de ESTADO del SQL, que es REDUNDANTE porque RegistroDePacks.instalados vuelve a filtrar, luego no habia nada que un test pudiera ver y salio NO CAZADA con rc=0, y ahora apunta al WHERE de verdad; (3) dos expectativas mal escritas, una de ellas nombrando la clase equivocada, que hacen que una sonda salga PARCIAL aunque el fallo este detectado a la perfeccion. Y UN HUECO DE COBERTURA REAL que la sonda M1 destapo: el recorrido de la CLI instalaba packs COMPATIBLES, luego el camino que ve el operador no estaba cubierto para el caso que duele. tests.total 3233, +38 con el desglose MEDIDO por diff de ids colectados; ver tests.total.

  previous_workitem: B0   # el bloque anterior, ya cerrado
  retired_workitem_note: WI-96   # LA REGLA DE SEMVER ESTABA EN EL FICHERO EQUIVOCADO Y NO LA COMPROBABA NADIE. Tercera vez que se hace la pregunta «que declara el repo que nada comprueba», tras WI-93 (suelos de cobertura) y WI-95 (CHANGELOG contra git tag). Esta vez el contrato es la REGLA QUE DECIDE EL NUMERO DE VERSION. MEDIDA sobre las 47 etiquetas con la regla tal como estaba escrita: 9 releases cuyo SemVer NO se deduce de ella; 9 que la regla dice que no deberian existir; y 3 CON CAMBIO ROMPEDOR REAL QUE NO LLEGARON A 1.0.0 (v0.7.0, que elimino 20 shims de retro-compatibilidad; v0.15.0; v0.16.2). Y AGENTS.md §12, que se titula «Regla de release», NO LA CONTENIA: el unico enunciado estaba en la cabecera del CHANGELOG, que no es el dueno de la gobernanza de releases. LA EXENCION 0.x que explica las tres estaba escrita en el mensaje de esos commits y en ningun otro sitio. EL GIRO DEL BLOQUE: al escribir el detector resulto que los tres precedentes NO LLEVAN EL MARCADOR de la convencion — ni `!` ni un footer `BREAKING CHANGE:` al principio de una linea, sino una vineta de prosa. Con el marcador ninguna herramienta puede verlos; sin el, el bump se deduce mal y la exencion queda sin justificacion visible. El primer clasificador buscaba la cadena en el cuerpo y contaba como breaking el propio commit que describia la clausula; al exigir la forma de footer, los tres desaparecieron del recuento. La conclusion correcta no es «no eran breaking», sino «fueron breaking y no estaban marcados». SE REGISTRA APARTE Y NO CUENTA para el bump: ensanchar la convencion despues de ver los datos seria rehacer la regla. CAMBIOS: (1) la tabla se muda a AGENTS.md §12 «Derivar la version» con la salvedad 0.x y sus tres precedentes; (2) el CHANGELOG pasa a REFERENCIAR §12, porque dos enunciados de la misma regla son dos fuentes que se desincronizan y una ya se ha desincronizado; (3) scripts/derive_semver.py calcula el bump de cada etiqueta Y de HEAD; (4) las trece divergencias se registran y NO se corrigen, porque son etiquetas publicadas y su numero es provenance. El calculo: desde v0.16.3 hasta v0.16.20 el bump se deduce SIN excepcion de tipo (18/18), y ahi es donde el guard exige coincidencia. Mutaciones 3/3, y las dos primeras las encontro el propio guard: M1 vaciaba la clausula 0.x conservando el texto «0.x» y el test solo buscaba esa cadena; M2 era el patron que buscaba `->` en un fichero que usa la flecha tipografica. Evidencia: evidence/sddk-wi96-verify-2026-10-02.md
  next_workitem: decision_del_operador   # RETIRADO 2026-10-02: el bloque anterior dejo anotado 'WI-65-fase-1' como siguiente trabajo y era FALSO. Medido contra el arbol: `platform/storage.py` son 613 LoC con 15 metodos (no 1807/80), y los 5 mixins existen y son live con 31/19/7/4/4 = 65 metodos. WI-65 ya lo entrego ADR-0022 y WI-68 lo remato; el informe de exploracion del ciclo se commiteo (c471264, 10:10) 81 minutos ANTES de la release que lo implemento (v0.16.10, 2ee6d77, 11:31). El ciclo `wi65-storage-facade-decomposition` se cerro con `goal-replaced`: su objetivo fue entregado, por otro bloque. El proyecto queda con 27 ciclos CLOSED y 0 abiertos. LECCION: un informe de exploracion puede ser excelente y aun asi estar vencido; la calidad del analisis no dice nada sobre si su premisa sigue en pie.     decisiones_para_el_operador, con su estado MEDIDO a 2026-10-02:   RESUELTAS en este bloque: (b) cierre de ciclos: eran 10, no 6, y los 10 cerrados mas los 2 OPEN; (e) la suite ya no reescribe tests/uat-evidence/ — WI-82 con `volatile_keys`; (g) `revision` es un sello informativo, no un contrato — ningun test lo verifica contra HEAD y no puede converger por construccion; cerrado con WI-82; (c) los 7 shims de WI-56: WI-81; y la reexportacion de los 5 mappers: CERRADA en WI-86 (cf6539b) — los 5 consumidores importan de la hoja `row_mappers` y storage deja de anunciar 7 simbolos que no usa; NO hizo falta ADR porque se demostro que no hay ciclo; (h) WI-80: CERRADO (eb19942). El criterio de 'no tocar el contrato externo' queda RETIRADO: confundia cambiar un contrato con corregir una afirmacion falsa; (i) triple alerta de deuda falsa: verificada y NO ejecutada, sin cambio.   ABIERTAS: (a) `list_file_signatures_for_source` (cc 10, 58 LoC) es el unico punto ciego del audit y ningun umbral lo captura. MEDIDO parcialmente en WI-87: **no esta muerto ni es un punto ciego de uso** — `knowledge/knowledge_controller.py:285` lo define y tiene 4 consumidores reales (3 en `governance/improvement.py`: 208, 268, 324; 1 en `knowledge_controller.py:442`) mas 3 ficheros de test. Lo que sigue SIN MEDIR es si esa complejidad es necesaria o si delata que mezcla responsabilidades. ABIERTO: hay que medir la complejidad rama a rama antes de proponer nada. (d) PROPIEDAD DE DOMINIO: **RESUELTA en WI-87** (d47b7af, ADR-0015). Medida, no supuesta: era real en tres sitios. El hallazgo que la supero lo que se sospechaba — no era solo que las constantes vivieran en la fachada, es que `core/runtime_types.py:142` YA tenia `TERMINAL_RUN_STATES` (con su helper `is_terminal_run_state`) y `storage.py` reimplementaba su complemento a mano, sin relacion verificada. El repo ya habia resuelto este mismo antipatron dos veces (QW-D para EVENT_KINDS, QW-E para SOURCE_KINDS) y se le habia escapado aqui. Ademas el test que decia cubrir la ligadura DDL<->constante comparaba el valor contra una copia de si mismo sin leer schema.py. (f) exit code de argparse: **RESUELTA en WI-88** (1a0c38b, ADR-0016). Medida con el binario correcto: los errores de uso devolvian 2 y 2 era EXIT_BAD_NAME, luego tres fallos distintos compartian numero. Ahora argparse sale con EXIT_USAGE y el 2 significa una sola cosa. 8 tests actualizados a proposito, ninguno borrado. Ojo al retomar: el comando de la CLI es `skillgraph`, NO `sg` — `sg` es `/usr/bin/sg`, la herramienta Unix de grupos, y medirlo da resultados que parecen confirmar cualquier premisa. **SEGUIMIENTO CERRADO en WI-89** (`64a28a8`): `audits/architecture-debt-*.md` ya no se reescribe al correr la suite. `--src-root` y `--out-dir`:parametrizan el auditor, y el mkdir salio del nivel de modulo a `main()`. Y la premisa de este seguimiento era mas estrecha de lo que se registro: solo cuando el informe commiteado estaba caducado, que era lo que ocurria en el commit de WI-87. El segundo modo —el primero de cada dia crea un fichero NUEVO sin trackear— no se habia medido, y es el que no depende de que cambie nada. Queda una **deuda de datos, no de codigo**: 63 informes fechados acumulados en `audits/`. No se decide aqui si se retienen, se pisan o se mueven a `evidence/`; es una politica de datos, no el defecto que se corrigio.   **(a) `list_file_signatures_for_source`: CERRADA en WI-90** (`e4fefb0`). La medicion de WI-87 era correcta pero estaba incompleta: la funcion no era ni muerta ni un punto ciego de uso, y la complejidad que el audit marcaba (cc 10, 58 LoC) estaba CONCENTRADA en un unico punto: 8 de las 58 lineas eran el deserializador duplicado a mano de un `to_dict` publico. Ese bloque desaparece y el resto queda por debajo del umbral. NO se refactorizo la funcion entera: la medicion no lo respaldaba, y corregir la propiedad medida no es cambiar la forma porque el numero moleste. **RETRACTADA EN WI-92** (`5b591c2`): la hipotesis de WI-90 sobre `governance/receipts.py:473-480` y `runtime/agent.py:57-64` era FALSA. `from_fixture` no es un inverso a mano sino un cargador tipado con `isinstance`; y `receipts.py` tiene un par asimetrico real pero con las tres listas de claves cuadradas (11/11/11) y el caller protegiendo el fallo por diseño. Medir una hipotesis antes de construirle un guard la habria convertido en deuda que nunca existio. Lo que si queda —el riesgo latente de que las tres listas dividan sin que nada lo note— esta cerrado con dos guards en tests/test_wi92_measured_claims.py. PENDIENTE SIN WORKITEM: autorizar push. El plano de release de SDDK no aplica aqui (`sddk release plan` exige Cargo.toml y esto es un paquete Python), asi que la release es manual segun AGENTS 12 del repo; y `sddk release apply --route local` haria push, que no esta pre-aprobado.
