  h9_coverage1_delta: "+17 tests cobertura graph_expansion.py (89% -> 98%): Either API unwrap/unwrap_err (2) + InvalidProposal.to_dict (1) + propose validations empty/whitespace operations/author/problem_observed (4) + validate attachment inexistente (1) + _find_capable false + Authorization (2) + cycle detection bfs_cycle/_cycle_source_nodes (2) + RemoveTransition filter apply_expansion (2) + W1 warning remove_transition active node (1). _Ok/_Err accedidos por nombre cualificado porque no estan en __all__. Spec: specs/h9-coverage-graph-expansion.md."
  h9_coverage2_delta: "+10 tests cobertura pack_loader.py 78% -> 97%: _make_schema_validator cubre refs passthrough (1) + list_of value no-lista (1) + number mismatch (1) + boolean mismatch (1) + dict no soportado (1) + schema tipo invalido (1) + declare_types_from_pack cubre types no-lista (1) + entry no-dict (1) + kind vacio (1) + schema no-dict (1). Sin tocar codigo de produccion. Spec: specs/h9-coverage-pack-loader.md."
  h9_coverage3_delta: "+8 tests cobertura skill_importer.py 89% -> 98%: _classify cubre yaml_config (.yaml/.yml, 2) + plain_text por mimetype text/* (1) + unknown cuando mimetypes no detecta (1) + _read_text_safely UnicodeDecodeError returns None (1) + analyze_skill root.is_file() (1) + analyze_skill kind=unknown produce ambiguous entry (1) + register_imported_skill locator_extra merge (1). Smoke empirico revelo que mimetypes.guess_type('.xyz') devuelve 'chemical/x-xyz' en Linux (no None), asi que se usa '.foobar' para forzar la rama unknown. Stmt 134 (mimetype text/* con extension fuera de sets) y brpart 252->205 restantes. Spec: specs/h9-coverage-skill-importer.md."
  h9_coverage4_delta: "+8 tests cobertura knowledge/git_source.py 86% -> 95%: from_commit con sha no-commit (Blob en object store) -> ValueError (1) + refresh() con pathspecs filtra blobs (1) + detect_changes until_commit=None usa HEAD (1) + detect_changes con pathspecs filtra (1) + status added cuando old_sha None (1) + status deleted cuando new_sha None (1) + _matches_pathspec literal prefijo-segmento (1) + _safe_capture_status exito devuelve dict (1). Stmts 78-79 (ImportError dulwich, requiere env sin dulwich) y ramas defensivas 252->254/255/325->exit/357-358 restantes. Spec: specs/h9-coverage-git-source.md."
  h9_coverage5_delta: "+4 tests cobertura resources/catalog.py 88% -> 100%: register_project duplicado (tenant_id, name) -> IdentityConflictError (1) + list_projects con resultados ordenados por name (1) + list_projects tenant vacio (1) + open_catalog path sin extension .sqlite -> ValidationError (1). Spec: specs/h9-coverage-catalog.md."
  h9_coverage6_delta: "+3 tests cobertura resources/registry.py 93% -> 95%: _validate_decision outcomes[i]['name'] no-string (1) + _validate_action transitions con clave no-string (1) + _validate_domain_pack capabilities no-lista (1). Stmt 79 (doble check apiVersion inconsistente) es dead code por construccion: el dict lookup usa brick.api_version como parte de la key, asi que brick_type.api_version == brick.api_version siempre. Documentado en spec; no testeable sin mutar _types directamente (fragilidad). Spec: specs/h9-coverage-registry.md."
  etapa7_s1_cancel_run_delta: "+5 tests cancel_run (run_id no existe -> NotFoundError; cancel en estado terminal; cancel en estado ACTIVE -> CANCELLED; cancel en estado WAITING -> CANCELLED; idempotencia: cancelar dos veces -> CANCELLED). v0.8.0 MINOR (a4d749e). +sg runs cancel CLI."
  etapa7_refactor_helpers_delta: "+6 tests refactor sin bump (ea54021): _transition_run_state_with_event y _is_budget_exhausted extraidos de RunController; 3 tests _fail_node_with (dbec3db). 0 LoC produccion eliminado, solo extracción."
  etapa7_s2_list_show_runs_delta: "+5 tests list_runs + show_run + sg runs list/show CLI (c6963f0). v0.10.0 MINOR. E2E subprocess verificado."
  etapa7_s3_logs_run_delta: "+5 tests logs_run (Storage.list_events_for_run ORDER BY sequence ASC) + sg runs logs CLI. v0.11.0 MINOR (6ad5789). 2 tests subprocess + 3 unit nuevos."
  etapa7_s4_budget_delta: "+20 tests RunBudget (max_visits/max_runtime_seconds/max_events) + sg runs budget CLI + sg run --budget-* (9d9ae09). v0.12.0 MINOR. Tabla run_budgets + migracion idempotente."
  etapa7_s5_redaction_delta: "+25 tests redaction policies (RedactionPolicy Literal, redact_payload, EventLog.policy_resolver, tenant_policies, sg policy get/set CLI) (72651ee). v0.13.0 MINOR. Bug fix en fixture event_log (compatibilidad pre-S5)."
  etapa7_s6_locks_delta: "+14 tests locks concurrentes (RunLock, RunLockKey, LockMode, LockUnavailable) + sg run --lock-mode/--lock-timeout-seconds + integration con hilos (241ccc9). v0.14.0 MINOR. Cierra vector de interleaving que podia saltarse redaccion."
