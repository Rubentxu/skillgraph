        miraba que el proceso siguiera vivo, otro hacia join() del hilo antes de comprobar, y el
        tercero decia «ha salido un error» queriendo decir «ha salido ESTE error», porque con el
        error tragado la excepcion igualmente salia de _migrate(). Y EL HARNESS SE DESTRUYO A SI
        MISMO: restauraba con `git checkout --`, que restaura DEL INDICE, y con el arreglo sin
        commitear se llevo el arreglo entero y las cinco sondas siguientes se quedaron sin texto
        que deformar — lo peor es que PARECIA funcionar, con la base verde y la primera sonda
        cazada. «Restaurar» y «borrar» son la misma operacion si no hay commit debajo, y por eso
        ahora se niega a empezar si encuentra cambios sin commitear en lo que va a restaurar. Y
        UNA PARADOJA QUE QUEDA ESCRITA: el bloque entrega un modulo NUEVO y un instrumento NUEVO, y
        el SemVer dice PATCH, porque journal.py viajar en un commit fix(platform) al ser el cambio
