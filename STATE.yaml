# Estado durable recuperable de la iniciativa.
#
# Apunta a la verdad observable (revisión, evidencia, próximo paso),
# no al historial completo (eso vive en SESSION-JOURNAL.md).

# Schema deliberadamente plano: fácil de leer, fácil de regenerar.
# NO incluir secretos, paths absolutos de usuario, ni literales de commit
# que no se hayan verificado contra `git rev-parse`.

