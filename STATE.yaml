  h9_bslice3_s8s9_no_conn_delta: "+6 tests del cierre de RunController sin conn: 2 Storage.conn (returns/is_same_as_underlying) + 2 firma sin conn (rejects_conn_keyword/signature_has_only_storage_and_adapter) + 1 camino end-to-end (create_run_and_reconcile_via_storage_conn verifica que EventLog comparte conexion con Storage) + 1 introspeccion no-regresion (__init__ sin 'self._conn' ni 'import sqlite3')."
