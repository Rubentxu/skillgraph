release:
  tag: v0.30.0
  fecha: 2026-10-04
  semver_bump: MINOR
  rationale_b10: >-
      BLOQUE B10 — LAS SUPERFICIES PUBLICAS, DECLARADAS Y CERTIFICADAS, cerrado.
      SemVer DERIVADO con scripts/derive_semver.py desde v0.28.1: b/f/x/n/d
      0/1/0/4/0, la regla pide MINOR -> v0.29.0. El `fix(core)` es el que
      aporta el valor, y conviene decirlo porque un PATCH suena a menor: sin
      el, dos propiedades del gate de 1.0 seguian siendo IN-CERTIFICABLES —
      no incumplidas, no certificables—. MEDIDO con
      scripts/measure_b9_gate_1_0.py, que deriva las veinte del propio
      ROADMAP.md: antes 13 PASS / 6 OPEN / 1 NO_MEASURABLE, despues 15 PASS
      / 4 OPEN / 1 NO_MEASURABLE. LA CUENTA INTERMEDIA fue 14/5, y el OPEN
      que sobraba era «roadmap/state/docs coherentes», que es precisamente
      el tests.total. Se puso al final del bloque con el run ejecutado, y
      esa propiedad volvio a PASS sola: la cadena que B8 monto se nota
      exactamente al usarla. LAS DOS PROPIEDADES QUE CIERRA estaban abiertas
      por FALTA DE CERTIFICACION, no por falta de codigo:
      «resource/controller API estable» porque skillgraph.core no declaraba
      __all__ —un paquete sin superficie declarada no tiene nada que pueda
      decir que es estable— y «CLI estable» porque no existia el snapshot, y
      once comandos de primer nivel podian cambiar sin que nada lo notara.
      LO IMPORTANTE NO ES LO QUE HACE EL GUARD, ES LO QUE SE LE OPUSO: las
      dos se cerraban en VEINTE SEGUNDOS escribiendo un __all__ y haciendo
      `touch` sobre el fichero, porque los predicados de B9 comprobaban la
      EXISTENCIA y un is_file() es lo mas facil de falsificar que hay. Un
      touch les daba PASS a los dos, con el gate de 1.0 exactamente igual de
      lejos. CERRADO con scripts/check_public_surfaces.py, que EJECUTA la
      comparacion contra el arbol en vez de mirar el fichero, y genera las
      dos superficies con --actualizar. VERIFICADO EN LAS CUATRO
      DIRECCIONES: snapshot vacio -> OPEN en las dos; comando quitado del
      snapshot -> OPEN; superficie real movida -> OPEN; estado de verdad ->
      PASS en las dos. DEFECTO DEL PROPIO GUARD, MEDIDO AL ESCRIBIRLO: la
      primera version comparaba los comandos de la CLI en UNA sola direccion
      (reales - declarados), y anadir un comando INVENTADO al snapshot pasaba
      en verde. Un guard que solo sabe detectar que el arbol crecio no vigila
      la declaracion, y la declaracion es justamente lo que dice «esto es lo
      que hay». Tres decisiones mas, cada una con su motivo. (1) La
      superficie del nucleo son 60 simbolos DERIVADOS del __all__ de los tres
      modulos, no escritos a mano, y se reexportan por IDENTIDAD: si el
      nucleo recreara la clase, el `except` que escribe un consumidor y el
      que lanza el nucleo serian dos clases distintas y el except no
      atraparia nada —la misma clase de defecto que el alias de
      AgentResult.from_fixture en WI-113—. (2) Las superficies viven en
      `surfaces/` y NO en `docs/`, porque `docs/*` esta en .gitignore salvo
      tres carve-outs y un snapshot que no viaja no declara nada: es el
      defecto que B8 midio con el hijo de concurrencia. El guard lo comprueba
      contra `git ls-files` POR FICHERO, no por directorio, que es el
      criterio que B8 escribio y midio en las dos direcciones. (3) El
      docstring anterior decia que cada modulo se reexportaba desde su
      ubicacion de primer nivel (`skillgraph.errors` y eso); MEDIDO: es
      falso, ninguno de esos tres modulos existe. Se borra la frase en vez
      de arreglarla, porque arreglarla seria fabricar un modulo de
      compatibilidad que nadie pidio y que volveria a caducar. LO QUE EL
      BLOQUE NO ABRE, con su motivo: «pack/controller lifecycle» y «upgrade
      desde releases soportadas» piden codigo que no existe; «runtime real
      certificado» pide SG_UAT_REAL_PROVIDER=1 y una credencial que este
      entorno no tiene; «security/threat model actualizado» pide reescribir
      un ADR que se aprobo describiendo un proyecto de 830 tests y 17
      releases. Y «TUI operacional» sigue NO_MEASURABLE, que no es lo mismo
      que OPEN: es una propiedad de una persona usando un terminal. HARNESS
      6/6 con 6 causas distintas, y DOS SONDAS NACIERON ROTAS y se cuentan
      porque el fallo era instructivo: envolver los 60 simbolos con
      type('Copia', (v,), {}) revienta con TypeError: metaclass conflict en
      los 28 NewType/frozenset, el modulo no importaba, y el harness veia
      rc=4 con CERO lineas FAILED — que se lee como «el guard no muerde»
      cuando lo que pasa es que la sonda estaba rota; un rc de colecta no es
      un test en rojo. Y una correccion al harness heredado de B9: contaba
      como «causa» el conjunto COMPLETO de tests en rojo, con lo que dos
      sondas legitimamente distintas se pisan en las dos centinelas de «esta
      todo verde» y el harness avisaba de causa compartida; ahora la causa
      es el conjunto de tests DIAGNOSTICOS de cada sonda. 19 tests en cinco
      conjuntos disjuntos, porque un guard con seis aserciones iguales mide
      una sola cosa seis veces.
  rationale_b6: >-
      BLOQUE B6 — Agent-first determinista, cerrado. SemVer DERIVADO con
      scripts/derive_semver.py: b/f/x/n/d 0/1/1/4/0, la regla pide MINOR ->
      v0.26.0. Ningun commit con marcador de ruptura. LO QUE ENTREGA, y es
      el hallazgo: el campo que PARECIA el sitio del origen epistemico ya
      existia y no decia lo que su nombre decia. Claim.extraction_method
      es un str libre cuyos tres valores medidos —static_analysis,
      regex_def, manual— son METODOS DE EXTRACCION, no origenes
      epistemicos: son dos ejes ortogonales, y con 'regex_def' no se sabe
      si lo afirmo la maquina o una persona. MEDIDO Y EN CONTRA DE LO QUE
      PARECIA: NADIE escribe extraction_method en src/ —las 10 de
      'manual' y las 4 de 'regex_def' estan todas en tests/, y en
      produccion solo vive el default de la declaracion—, luego es un eje
      que nadie rellena y no puede ser donde nazca el origen. LA SEPARACION
      NO ES UNA PREFERENCIA: es la unica forma de que el gate tenga donde
      escribir, porque un valor no puede decir quien afirma y como se
      extrajo a la vez. CERRADO con AssertionOrigin como Literal cerrado en
      core/runtime_types.py y ASSERTION_ORIGINS DERIVADO por get_args
      (nunca a mano: es el error de QW-E, un conjunto literal se queda
      corto cuando el Literal crece y entonces la validacion rechaza el
      valor nuevo que el tipo si acepta); Claim.assertion_origin con
      default 'observed', el unico origen que no promete autoridad;
      InvalidAssertionOriginError con code PROPIO
      sg_invalid_assertion_origin, porque un code compartido rompe la
      traduccion a exit code (WI-109); CHECK en la DDL, porque un
      vocabulario que solo vive en Python no se puede exigir donde se
      escribe de verdad; y propagacion por INSERT, SELECT, mappers, DTO,
      promocion y la proyeccion de query. LA MIGRACION es el hallazgo que
      la suite NO ve: CREATE TABLE IF NOT EXISTS NO anade columnas a una
      tabla que ya existe —medido: una base nueva funciona y una vieja no,
      y el fallo sale en produccion y no en los tests, que construyen la
      base desde cero cada vez—. TRES BUGS DEL PROPIO INSTRUMENTO antes de
      que sirviera, los tres el error de siempre, un medidor que miente en
      verde: P3 buscaba CHECK en todo schema.py y decia CERRADO con el
      CHECK de OTRA tabla; P2 escribia a mano 'es str' en las dos ramas
      del detalle; y _campo_de_claim derivaba el nombre del campo del
      nombre de la clase (Claim -> claim), no encontraba
      extraction_method, devolvia None, y None se leia como 'ya no es
      str'. CUATRO AGUJEROS REALES ENCONTRADOS POR EL HARNESS, y no sondas
      malas: (1) el guard de P6 buscaba la MENCION de los dos nombres con
      ast.dump y pasaba en verde con la validacion gutiada, porque el
      mensaje del raise sigue nombrando el conjunto —un guard que mide la
      prosa del error no mide la validacion—; (2) el harness llevaba -x, y
      sin -x, M3, M6, M7 y M8 NO cazaban: sus mutaciones dejaban la suite
      en verde y el 8/8 era un numero que no se podia desarmar, con cuatro
      sondas heredando el fallo de la anterior; (3) el harness guardaba el
      sha y 'restauraba' reescribiendo el fichero con sus propios bytes,
      que es no hacer nada; (4) el guard de WI-92 cazo el bloque vivo de
      CURRENT dos veces, y las dos con razon —primero porque no citaba
      ninguna linea, despues porque el formato es fichero.py:LINEA::Simbolo
      con DOS puntos y yo escribia tres—. Se corrigieron las citas, no el
      guard. VERIFICACION: 23 tests, mutaciones 8/8 con 8 CAUSAS
      DISTINTAS y arbol restaurado byte a byte. tests.total 3053, +23 y
      todos de test_b6_provenance.py, porque este bloque no creo modulos
      nuevos y el guard de wi47 se queda en 255. FUERA DE ALCANCE Y
      REGISTRADO: P5, si el proveedor real PUEBLA conocimiento o lo
      CONSUME, que depende de una credencial que este entorno no tiene; el
      medidor la mantiene abierta y por eso NO baja el veredicto — es
      deuda, no un olvido—.
  rationale_b3: >-
      BLOQUE B3 — Core extensible, cerrado. SemVer DERIVADO con
      scripts/derive_semver.py: b/f/x/n/d 0/5/2/20/0, la regla pide MINOR ->
      v0.23.0. Ningún commit con marcador de ruptura; los diez commits que
      la herramienta marca como rompedores SIN marcador son de la serie v0.3-v0.17
      y no cuentan para el bump, porque la convención es la convención.
      LO QUE ENTREGA, y es lo que el gate del roadmap pedía («anadir una
      capability SIN MODIFICAR RunController, el storage base ni el motor del
      workflow»): el puerto de capabilities deja de ser INALCANZABLE desde
      src/ —MEDIDO antes de escribir nada: dieciseis construcciones de
      CapabilityRegistry en el arbol, las dieciseis en tests, cero
      importadores del puerto bajo src/—, y nace el primer adapter de
      PRODUCCION, sg.knowledge.query, contra el Protocol
      KnowledgeRepository, que es dominio propio y no reconstruye el producto
      de nadie. El kernel CapabilityController recibe NOMBRES y los resuelve
      contra el registro inyectado; CapabilityOutcome une el tipo PEDIDO con
      el spec que RESPONDIO, porque son dos cosas y sin el par no se puede
      auditar. La costura RunController(capabilities=...) es OPCIONAL y su
      ausencia ES la politica: sin registro —el default— un plan que declara
      'stale' sigue ejecutandose, porque 'stale' es un FreshnessState y no una
      capability; con registro, lo declarado tiene que existir o el nodo
      queda FAILED con CapabilityNotFound SIN GASTAR UNA LLAMADA AL ADAPTER,
      que es la propiedad que no se ve en la fila del nodo. LO QUE NO SE
      HACE, por decision: las capabilities no se invocan durante la
      ejecucion, solo se verifican, porque Handoff.capabilities esta en el
      hash firmado (runtime/handoff.py:195::Handoff.to_dict) y cambiarlo es
      ruptura de datos — B8. MUTACIONES 6/6, 0 sondas invalidas, arbol
      restaurado y verificado por git diff de salida identico al de entrada;
      harness VERSIONADO en scripts/mutate_b3_production_gate.py y no en
      .pipelinek/, porque las mediciones de este repo no son recuperables
      (registrado como item de backlog bl-bl-01M41DFZEZ0003882TZNP7NPM0).
      Evidencia: evidence/sddk-b3-2026-10-03.md
  rationale_b2: >-
      BLOQUE B2 — Runtime real, no representativo. Sin release. MEDIDO ANTES DE ESCRIBIR NADA, que es lo que hace el bloque distinto: CERO SIGKILL en todo tests/ y CERO ficheros SQLite escritos por dos programas a la vez. Toda la superficie de crash eran FAILPOINTS y toda la de concurrencia, THREADS — y ninguna de las dos es lo que parece: un failpoint hace que el proceso lance, y al lanzar Python desenrolla la pila, ejecuta los finally, cierra la conexion y SQLite consolida el journal por rollback, que es un cierre ORDENADO; y dos hilos no se ejecutan a la vez porque el GIL los serializa, luego el test media una interleaving que el sistema real no tiene. CRASH REAL, con el hijo matandose a si mismo con os.kill(getpid(), SIGKILL) justo despues de la escritura que interesa, y el padre leyendo solo el disco en mode=ro: escribir sin commit -> 0 filas; transaccion abierta con dos filas -> 0 filas; commit y muerte inmediata -> 1 fila. integrity_check ok en los tres. LA QUE IMPORTA ES LA SEGUNDA: un failpoint que hace rollback deja la base tan limpia como un commit, los dos se ven iguales desde fuera, y solo apagando el proceso se ve que lo no confirmado desaparece ENTERO. Y la tercera, que se olvida: un motor que «recuperase» tambien lo confirmado estaria PERDIENDO datos. 10 tests, mutaciones 4/4 con 0 sondas invalidas. CONCURRENCIA REAL: ocho procesos, diez escrituras cada uno, el Storage de verdad — 80 de 80, cero perdidas — despues de arreglar TRES defectos de produccion que NO estaban en el runtime sino en la APERTURA de la base. (1) `PRAGMA journal_mode = WAL` sin busy_timeout: el PRAGMA es idempotente pero TOMA UN LOCK DE ESCRITURA para averiguarlo, y el timeout de sqlite3.connect (5 s por defecto) no lo cubria — medido: 70 de 80 eventos, DIEZ ESCRITURAS PERDIDAS SIN DEJAR RASTRO, porque el proceso moria en su Storage(...) antes de escribir. (2) `_migrate` era un check-then-act: SELECT y, si vacio, INSERT; ocho procesos abriendo una base nueva veian todos schema_version vacia y los ocho insertaban, con UNIQUE(version) convierte la carrera en IntegrityError. Resuelto con INSERT OR IGNORE y BORRANDO el SELECT: la constraint resuelve la carrera, que es literalmente AGENTS 8 «idempotencia por constraint, no por codigo», y el SELECT se iba porque era el que tomaba la decision. (3) el busy_timeout no cubria el bloqueo DENTRO de la conversion del journal; reintento acotado una vez, y si el segundo intento falla la excepcion sube — NUNCA except: pass, que dejaria la base en delete sin que nadie lo supiera—. MEDIDO PARA NO CULPAR AL ENTORNO SIN PRUEBA: /tmp es tmpfs al 74% y WI-112 ya habia registrado un Disk quota ahi, luego podia ser el culpable. Con el reintento RETIRADO fallan 4 de 6 corridas tambien en disco normal, luego la diferencia es del arreglo y no del /tmp; con el, 12/12 en /tmp y 10/10 en disco normal. CUARTO DEFECTO, en el instrumento de B0: un skip correctamente DECLARADO ponia rojo el run, porque el criterio contaba TODOS los skips y la lista SKIPS_PLATAFORMA no servia para nada — existia, se mantenia en dos sitios y no cambiaba ningun veredicto. Nadie lo noto porque en Linux no habia ningun skip de plataforma activo. Ahora la regla tiene TRES estados (0 limpio; iguales a los declarados, cumple; cualquier otro numero, incumple) y el declarado se cuenta por AST sobre la lista, con la misma convencion que el guard de WI-108. SIN CERTIFICAR Y POR NOMBRE: el PROVEEDOR REAL. La UAT existe, es opt-in por credencial (SG_UAT_REAL_PROVIDER=1), esta construida y DECLARADA, pero NO SE EJECUTO porque este entorno no tiene credenciales. Declararlo es el trabajo que WI-91 hizo con el addendum de H9. La frase del H7 NO puede marcarse aun como probada literalmente: dos de sus tres patas estan, la tercera no; y de los cinco pares de concurrencia que pide el bloque se cubren escritura/escritura y lectura/escritura a nivel de Storage, no run/run ni promotion/promotion. Evidencia: evidence/sddk-b2-2026-10-03.md
  rationale_b1: >-
      BLOQUE B1 — Cierre de stewardship. Sin release. La serie WI-91..WI-115 se abrio con una pregunta que admite un workitem por contrato, PARA SIEMPRE; B0 la cerro y B1 la convierte en un inventario FINITO con criterio de terminacion: cada contrato es GUARDED, NO-GUARANTEED, o DEUDA con el motivo POR ESCRITO. Y una regla que el inventario se aplica a si mismo: un contrato que se sostiene hoy y que nadie puede romper NO se instrumenta — vigilar una verdad imposible de violar es la peor version de un guard, da cobertura aparente y no mide nada. MEDIDO (.pipelinek/b1_inventory.py + b1_verdict.py): 17 contratos sobre 17 categorias, 1122 sitios, 14 GUARDED, 2 DEUDA, 1 NO-APLICA demostrado, 0 deuda critica, 0 citas rotas. LAS DOS DEUDAS, con motivo escrito: inmutabilidad (23 dataclasses frozen con campos dict/list/set — WI-113 los midio uno a uno y no hay ni un sitio que los mute, es deuda de ESTILO no defecto de comportamiento) y capabilities (32 Protocols en platform/ports — no es deuda de B1, es que el concepto de capability que pide B3 aun no existe; lo que hay son puertos de persistencia, y se acepta como BASE de B3). LA CATEGORIA QUE NO APLICA es subprocess boundaries: cero en el nucleo, MEDIDO con grep sobre src/, y la razon es que la frontera de subprocess la usan los TESTS (UAT-13 mata el proceso desde fuera), no el codigo de produccion. Cero no es 'cumplido' — se declara NO-APLICA-O-INSTRUMENTO-ROTO y se demuestra por que. LO QUE B1 ENCONTRO DE VERDAD: cuatro MEDIDORES ROTOS, y cada uno es una variante del mismo error. (1) El predicado de inmutabilidad miraba decorator.args[0] —el primer argumento POSICIONAL— y el repo escribe @dataclass(frozen=True, slots=True) con frozen como PALABRA CLAVE: args vacio, cero dataclasses frozen donde hay 23. Esto es el error 32 de WI-113 por el otro lado: un predicado que busca la convencion que el repo escribe de otra manera devuelve la lista vacia, el inventario dice 'cero', y nadie se entera porque CERO NO SE VE RARO. (2) capabilities buscaba 'port' y casaba dentro de 'comportamiento': 875 falsos positivos — un predicado demasiado ancho no es menos roto que uno demasiado estrecho. (3) subprocess buscaba Popen( y (4) paths buscaba project_root, cuando se llama project_dir. En el VEREDICTO, dos mas: la deteccion de deuda critica buscaba las palabras 'riesgo'/'defecto' en el motivo escrito y marcó las dos deudas, incluida capabilities cuyo motivo dice que NO es un defecto — un predicado que busca en la prosa que se supone que mide confunde su propia descripcion con su veredicto, WI-106 aplicado a un campo de texto; ahora es ESTRUCTURAL (critica = DEUDA y sin guard). Y el veredicto citaba tests/test_wi93_coverage_floors.py, que NO EXISTE (los suelos los vigila scripts/check_coverage_floors.py), y nadie lo noto porque un veredicto se LEE, no se EJECUTA: ahora citas_rotas() lo comprueba, distiguiendo las citas de codigo de los ficheros de ejemplo en prosa (borra los docstrings del AST antes de escanear, porque un verificador que no distingue un ejemplo de una cita obliga a escribir los ejemplos de otra forma). EL PROBLEMA EXPRESO QUE B1 NOMBRA —el SQL directo de 'promotion list'— YA ESTABA CERRADO: cli/commands/promotion.py:358 llama a la API publica storage.list_promotions(), y el propio modulo lleva un comentario que dice lo contrario. Lo que quedaba era el README afirmandolo abierto. Arreglarlo era corregir una afirmacion vieja, no cerrar un agujero. CONTRASALTOS EJECUTADOS: renombrar un guard citado a un fichero inexistente da rc=1 y nombra el fichero roto; en estado sano rc=0. SIN RELEASE: derive_semver.py manda. Evidencia: evidence/sddk-b1-inventory-2026-10-03.md  rationale_b0: >-
      BLOQUE B0 — Convergencia de verdad. Sin release. MEDIDO al abrir (.pipelinek/b0_measure.py, solo lectura): version 0.22.5.dev0, release declarada v0.22.5, tag real v0.22.5, workitem STATE WI-96, workitem CURRENT WI-115, tests declarados 2838, tests colectados 2844, y NINGUN ROADMAP.md en la raiz. TRES CONTRADICCIONES, no una: (1) STATE vivia 19 workitems atras respecto a CURRENT — los dos campos describen el MISMO bloque y los dos tenian razon sobre su propio fichero; (2) la cifra de tests no cuadraba, y la causa eran 6 tests de un fichero SIN TRACKEAR (el guard de doctests) — el guard de WI-115 estaba EN ROJO ANTES de abrir el bloque: un guard que funciona se ve feo, uno que no funciona no se ve; (3) el roadmap no tenia dueno, y habia tres ficheros ROADMAP.md ninguno de los cuales era el del proyecto vivo. DOS ERRORES DEL PROPIO INSTRUMENTO, corregidos antes de contar: el comparador de workitems era state.startswith(current[:2]), que con WI-96 y WI-115 da 'WI-96'.startswith('WI') — SIEMPRE verdadero, la contradiccion que el bloque existe para cerrar pasaba en verde en el script que la mide; y el filtro de roadmaps leia parts[0] sobre rutas absolutas de rglob, asi que parts[0] es '/' y no filtraba, listando dos sandboxes de .pipelinek/ como roadmaps vivos. ARREGLO: (1) ROADMAP.md en la raiz como autoridad unica B0..B9, con bloque vivo en formato legible por maquina; el roadmap del blueprint v1 NO se muda, se degrada EN SU SITIO declarandose historico, porque la evidencia antigua lo cita por esa ruta y esa evidencia es provenance; (2) scripts/project_truth.py, la respuesta machine-readable UNICA a '¿donde esta el proyecto y que toca despues?', con codigo de salida de TRES valores (0 coherente, 1 contradiccion, 2 no se pudo medir) — el tercero evita el error 32 de WI-113, una sonda que apuntaba a un texto inexistente y se contaba como victoria; (3) tests/test_b0_truth_convergence.py, 12 tests, que EJECUTA el script y verifica su veredicto en vez de reimplementar el cruce — dos copias de la misma regla divergen el dia que una se actualiza y la otra no. MUTACIONES 7/7 con 0 sondas invalidas, restauracion byte a byte verificada por sha. M7 es el contraejemplo del propio harness: comprueba que una sonda que NO APLICA se reporta como SIN_SONDA y no como victoria. ERROR PROPIO 43: gate() y su llamante incrementaban ambos TOTAL y la primera pasada dio '7/13 cazadas' con siete sondas que si habian cazado — un contador contado dos veces no mide la proporcion que dice medir. LAS CUATRO primeras certificaciones NO fueron verdes, y las cuatro eran defectos reales: el gate de B0 fallando (correcto), el guard de WI-115 ya en rojo por el fichero sin trackear, el bloque vivo sin ninguna cita verificable (un guard sobre cero citas no vigila nada), y el contrato del sdist exigiendo que los ficheros de test esten versionados — por eso los tests van en el MISMO commit que el script. RESULTADO: 2856 passed in 153.61s, 0 skipped, declarado == colectado. SDDK adoptado sin impacto en el arbol y ciclo p-b7740b96d79ec013/b0 OPEN. SIN RELEASE: derive_semver.py manda y este bloque no obliga a ninguna version. Evidencia: evidence/sddk-b0-2026-10-03.md  rationale_wi115: >-
      Bloque WI-115. SIN RELEASE, Y POR REGLA: desde v0.22.5 hasta HEAD hay 0 breaking, 0 feat, 0 fix, 4 test y 4 docs, asi que scripts/derive_semver.py dice literalmente «la regla dice SIN BUMP: no hay release que emitir, se acumula», y AGENTS.md 12 es explicito: «si la regla dice sin bump, no se emite etiqueta». NO hay v0.22.6. `release.tag` sigue en v0.22.5 y `release.semver_bump` en PATCH porque esos dos campos describen la ULTIMA release real, no el workitem en curso. Es el SEGUNDO bloque de la serie que no libera, despues de WI-106, y es la regla siguiendo, no la regla saltandose. DECIMO SEPTIMA via de la serie «que declara el repo que nada comprueba», y la MAS AUTOCONSCIENTE: el workitem salio de una LINEA QUE YO MISMO ESCRI en WI-113, al registrar un descarte. Decia, textualmente, que no existia ningun guard que comparase tests.total con el recuento real, y lo deje anotado como una precision sobre por que ese campo no habia causado el fallo. Era cierto, y era exactamente el siguiente hueco. MEDIDO antes de tocar nada, con STATE.yaml restaurado byte a byte y sha verificado (.pipelinek/wi115_measure.py): STATE.yaml tests.total 2834, tests colectados 2834, hoy coinciden True. ESO NO ES LA PROPIEDAD. La propiedad es si dejaran de coincidir, algo se pone rojo. M1: puesto total=2971, governance rc=0, VERDE. M2: anadido un test sin tocar el estado (2835 colectados), governance rc=0, VERDE. La cifra puede mentir en las dos direcciones y el repositorio entero no se entera. LO QUE LE DA GRAVEDAD ESTA MEDIDO TAMBIEN: en WI-109 la primera certificacion dio 2753 passed + 1 failed, y EL FALLO ERA ESTE CAMPO, porque el post-release bumpeaba __init__.py y dejo tests.package_version viejo. El hermano pequeno quedo vigilado desde entonces; el grande seguia a oscuras, y M1 dice que hoy tampoco. EL RECUENTO VIENE DEL ARBOL: pytest --collect-only en un subproceso, nunca del estado. Un guard que comparase contra una copia escrita en el propio test seria el guard que compara contra su propia copia, el error de WI-106. UN TEST Y NO UNA ETAPA DE LA RECETA: .pipeline.kts tiene un SHA-256 declarado invariante desde WI-110, y anadir una etapa seria cambiar ese invariante por un fallo que se cierra dentro de la suite; una etapa nueva es un contrato de CI y un test es un test. CUATRO TESTS, TRES CONTRASALTOS: que el campo exista y sea un entero (si no, borrar el campo daria un KeyError que parece un bug del guard), que el estado siga parseando como YAML (WI-85 demostro que la seccion tests: se puede tapar con un snapshot anidado por error), y que el recuento real se pueda leer y sea plausible — sin ese ultimo, el patron de la salida de pytest podria dejar de coincidir y el guard compararia contra un CERO SILENCIOSO el dia que pytest cambie una cadena. Mutaciones 3/3, y M2 mide precisamente ese cero: rompe el patron de la salida de pytest y el guard tiene que FALLAR por no poder medirse, no pasar. Esta cazada. M3 no apuntaba al principio, por ocho espacios de indentacion donde el texto real tiene cuatro, y eso se comprobo ANTES de mutar. Cache por sesion del recuento: sin cache el fichero lanzaria cuatro subprocesos de colecta completa para leer siempre el mismo numero; medido 4,10s -> 2,34s.
  rationale_wi114: >-
      Bloque WI-114. SemVer derivado del historial con scripts/derive_semver.py: la regla pide PATCH -> v0.22.5. DECIMO SEXTA via de la serie «que declara el repo que nada comprueba», y la primera ELEGIDA POR MEDICION entre varias: antes de abrirla se rastrearon ocho vinetas declaradas de AGENTS.md y CUATRO DIERON CERO —lru_cache, time.time(), Optional[T] y ORM—, que se sostienen hoy y que no se abren porque instrumentar una verdad que nadie puede romper es la peor version de un guard. La quinta dio un cero SOSPECHOSO: cero ON CONFLICT en todo el repo, con un UNIQUE(event_id) que si existe. MEDIDO por AST sobre el arbol real: 6 sitios escriben eventos, 5 traducen, 1 no. EL DEFECTO: storage._atomic_state_and_event tenia un docstring que decia «Re-raise como IdempotencyError cuando el UNIQUE sobre runtime_events.event_id se viola (UAT-07, replay-safe)» y su cuerpo hacia `except BaseException: raise`. La traduccion no la hacia ese metodo: la hacia CADA UNO DE LOS CINCO LLAMADORES, por su cuenta, y nada lo comprobaba. LO GRAVE NO ES QUE HOY FALLE: sqlite3.IntegrityError no es SkillGraphError, luego atraviesa el `except` que traduce a exit code —el de WI-109— y sale como Traceback al usuario. Un camino de escritura nuevo sin `try` abria la frontera, y no tendria ni a quien preguntarle. ARREGLO: la traduccion baja a `_insert_event_in_tx`, que es donde ocurre el INSERT y por donde pasan los seis caminos. Los cinco llamadores capturan ahora el error DEL DOMINIO para enriquecer el mensaje con su nombre de funcion; su `except sqlite3.IntegrityError` era codigo muerto que ademas parecia vivo, porque de ahi se deducia que la traduccion dependia de el. EL CONJUNTO SE DERIVA DEL ARBOL: ni la lista de caminos ni la de funciones estan escritas en el test, salen de buscar las llamadas a los dos helpers; una lista de «los sitios que traducen» es la misma trampa que DIRECTORIOS_NO_RECETA (WI-99) y que «conectar != contener» (WI-102). DOS CONTRASALTOS: que la derivacion encuentre al menos seis caminos (una derivacion que devolviera siempre la lista vacia pasaria todo en verde, es el M2 de WI-110) y que el helper no quede muerto. EL INSTRUMENTO TAMBIEN TUVO QUE CAMBIAR, y es lo que mas importa del bloque: el script que media «quien traduce» tenia como predicado exactamente la convencion que este workitem elimina, asi que despues del arreglo daba 0 de 6, que no era un resultado sino una mentira. Ahora mide DE DONDE PUEDE SALIR un error del adapter. Un guard que mide la convencion que acabas de tirar necesita tirarse tambien el, o miente en verde. 7 tests, 2 de ellos contrasaltos. Mutaciones 4/4 con sonda por mutacion, y tres de las cuatro sondas apuntaban al texto ANTERIOR porque ruff format habia colapsado los f-string: es el error 32 de WI-113 repetido en el workitem siguiente, detectado antes de contar porque el harness distingue SIN_SONDA de CAZADA. 1214 tests afectados verdes.
  rationale_wi113: >-
      Bloque WI-113. SemVer derivado del historial con scripts/derive_semver.py: b/f/x/n/d 0/0/1/2/0, la regla pide PATCH -> v0.22.4. DECIMO QUINTA via de la serie «que declara el repo que nada comprueba». AGENTS.md 1.1 decia que un dict externo se envuelve en MappingProxyType. WI-111 lo aplico al budget del Handoff y dejo ONCE campos dict/list/set dentro de dataclasses frozen como deuda registrada, con el criterio de que no participaban en el hash firmado. ESE CRITERIO ERA CORRECTO PARA EL HASH Y EQUIVOCADO PARA EL RESTO: uno de los once no tenia un dict mutable, tenia un ALIAS. AgentResult.from_fixture validaba que result fuera un dict y lo guardaba TAL CUAL, asi que el AgentResult que el Core creia inmutable ERA el dict de quien lo produjo, y quien lo produce es el Adapter, que es codigo externo al repo. MEDIDO antes de arreglar nada, con ejecucion real: externo = {"outcome": "ok", "result": {"dato": 1}}; r = AgentResult.from_fixture(externo); externo["result"]["dato"] = 999; r.result -> {'dato': 999}. El AgentResult cambio sin que nadie lo tocara. Y NO ERA COSMETICO: node_execution_delegations.py:443::_finalize_node_success serializa ese dict a disco, asi que lo persistido era el del Adapter. ARREGLO: deepcopy y no dict(), porque el payload tiene niveles anidados y una copia de primer nivel deja los hijos compartidos. POR QUE NO MappingProxyType, Y EN WI-111 SI: en HandoffExecution.budget el dict solo se leia; aqui el motor SERIALIZA el resultado y json.dumps no acepta un mappingproxy, asi que envolverlo romperia la frontera. La inmutabilidad de este campo no la aporta el tipo, la aporta que el Core ya no comparte memoria con el exterior. UN CRITERIO SE REFORMULO SOBRE LA MARCHA: el test que exigia MappingProxyType se sustituyo por test_el_resultado_es_un_dict_plano_y_serializable, porque exigir el tipo habria roto la frontera que el arreglo respeta. EL GUARD EJECUTA, NO LEE: por AST se veria que el campo esta anotado dict[str, Any], que es exactamente lo que la regla permite; la propiedad «el valor no se aliasa al llamante» solo se mide construyendo el objeto y mutando el origen. LO QUE NO SE ABRE: los otros diez dicts —procedencia_por_firma, revisiones_por_fuente, limites, metadatos— tienen CERO sitios que los muten, segun medicion. Son deuda de estilo, no defecto de comportamiento, y el hash firmado no se ve afectado. Arreglarlos seria tocar codigo correcto sin prueba de que esta mal. 15 tests, 3/3 mutaciones con sonda verificada por ejecucion real antes de contar. ERROR PROPIO 32: el primer harness daba 1/3 porque la sonda M3 apuntaba a un texto que ruff format habia colapsado a una linea; una mutacion INVALIDA es un artefacto del formateo, y contarla habria hecho creer que el guard cazaba menos de lo que caza.
  rationale_wi112: >-
      Bloque WI-112. SemVer derivado del historial con scripts/derive_semver.py: 0 breaking, 0 feat, 1 fix, 2 docs, 0 chore => la regla pide PATCH -> v0.22.3. DECIMO CUARTA via de la serie «que declara el repo que nada comprueba». AGENTS.md 1.3 decia que el reloj «se inyecta (default factory con datetime.now(UTC)) y se puede mockear», y runtime/engine.py declaraba que now_iso() era el «Unico punto de definicion». Ninguna de las dos se sostenia. MEDIDO por AST antes de tocar nada: 10 llamadas a datetime.now en src/skillgraph, en TRES formatos — isoformat() 5, replace(microsecond=0) 2, strftime 3. Dos instantes del mismo segundo podian serializarse a dos strings que no comparaban entre si. Y RuntimeEvent traia field(default_factory=lambda: datetime.now(UTC).isoformat()): una lambda que captura el reloj real no tiene por donde inyectarle otro, asi que «se puede mockear» era cierto solo con monkeypatch del modulo. ARREGLO: now_iso(clock=None) es la unica lectura del reloj del nucleo y acepta un reloj inyectado; RuntimeEvent.timestamp usa default_factory=now_iso y hereda el formato unico; event_store, catalog, expansion, promotion y backups delegan. LO QUE NO SE UNIFICO Y POR QUE: backups, improvement y receipts siguen usando strftime a proposito, porque producen 'YYYY-MM-DDTHH:MM:SSZ', que es un NOMBRE DE FICHERO y no un instante de evento; unificarlos cambiaria receipts y nombres de backup ya emitidos. La lista esta declarada en el guard y no en el codigo de produccion, porque es una excepcion y no una regla, y el guard la vigila en las dos direcciones. EL DEFAULT FACTORY SE QUEDA: AGENTS.md 1.3 lo pide, y hacer timestamp obligatorio iba contra la regla y rompia 37 tests sin anadir capacidad; la inyeccion real es now_iso(clock=...) y EventBuilder._emit(timestamp=...). EL GUARD MIDE LA PROPIEDAD, NO EL NOMBRE: «no hay una segunda lectura del reloj», no «existe una funcion llamada now_iso», asi que rastrea por AST porque el docstring del propio now_iso menciona datetime.now y un rastreo por cadena contaria la prosa. DOS DEFECTOS DE SERIE. (1) Un guard que tenia razon: al correr la suite con TMPDIR dentro del repo para esquivar un OSError Errno 122 Disk quota exceeded, WI-89 fallo diciendo que el sandbox escribia DENTRO del repositorio. Tenia razon; el sandbox se movio a /var/home y el guard no se toco. (2) Una prueba intermitente destapada por el formato unico: test_wi56 comparaba dos llamadas al reloj real y fallo 2 de 22 veces. Medido, 4 de cada 2000 pares de now_iso separados por 2 ms cruzan un segundo. Con microsegundos nunca habria pasado: la unificacion cambio la probabilidad, no la extension. Se normaliza el instante en esa prueba, y un contrasalto exige que la normalizacion NO se coma el resto del registro. 17 tests, 5/5 mutaciones con sonda por mutacion, mypy 143 antes y 143 despues.
  rationale_wi111: >-
      Bloque WI-111. SemVer derivado del historial: la regla pide PATCH -> v0.22.2, calculado con scripts/derive_semver.py, nunca a mano. DECIMO TERCERA via de la serie «que declara el repo que nada comprueba». AGENTS.md 8 declaraba tres cosas del Handoff que no se sostenian: que es INMUTABLE, que su hash es SHA-256 sobre serializacion estable, y que el Adapter «recibe el hash firmado; nunca lo recalcula». Las tres tenian la misma causa: frozen=True congela el ENLACE del atributo, no su VALOR, y HandoffExecution.budget era dict[str, int]. MEDIDO antes de tocar nada (.pipelinek/wi111_measure.py), ejecutando un nodo real contra un Storage real y leyendo de disco: la fila node_executions.context_hash daba 0063e7df, los eventos NodeCompleted y EvidenceProduced daban 951a2d3a, y el handoff_json persistido era {'max_nodes': 1} sin la clave que el Adapter habia inyectado. La fila describia el handoff de ANTES y los eventos el de DESPUES, para la misma node_execution. El motor persistia el hash en la linea 219 y lo RECALCULABA en la 144, despues de que el Adapter tuviera el handoff en la mano: eso es literalmente lo que la vineta prohibe. ARREGLO: budget pasa a Mapping[str, int] envuelto en MappingProxyType sobre una COPIA defensiva, y _compile_node_handoff devuelve (handoff, context_hash) para que el hash se calcule UNA vez al firmarlo. EL GUARD NO LEE EL CODIGO: ejecuta un nodo y lee node_executions y runtime_events despues, porque un guard por AST habria medido la regla y no el defecto, que estaba en la distancia temporal entre firmar y entregar. TRES DEFECTOS DEL PROPIO GUARD, que las mutaciones lo dejaron ver y que estan escritos en AGENTS.md 8: (1) un test comparaba contra una llamada NUEVA de _handoff() en vez de releer el handoff mutado, y no podia fallar nunca; (2) MappingProxyType ES IGUAL a un dict, asi que comparar con == pasaba con el mapping vivo devuelto — lo que discrimina es el tipo y que json.dumps lo acepte; (3) contar llamadas a context_hash sin distinguir el origen contaba la lectura del propio Adapter como una recalculacion del motor, asi que se cuenta por origen. M5 se reescribio DOS veces: la primera quitaba el sorted(), que resulto INOCUA porque quitar el orden no rompe la copia, y su sonda apuntaba al test tautologico. M5 mutaciones 5/5 con sonda por mutacion. DOS GUARDS ROTOS POR EL PROPIO CAMBIO, resueltos cambiando el codigo y no la regla: el de 80 LoC de WI-66 se cumplio extrayendo _open_running_node (74 -> 83 -> 76) y el deWI-67 se cumplio anadiendo el metodo nuevo a la lista de movidos (22 -> 23). Subir un umbral para que el codigo pase no comprueba nada. 2795 passed, 0 skipped.
  rationale_wi110: >-
      Bloque WI-110. SemVer derivado del historial: 1 fix, 4 docs, 0 breaking => PATCH. CALCULA scripts/derive_semver.py: b/f/x/n/d 0/0/1/4/0, la regla pide PATCH -> v0.22.1. DECIMA SEGUNDA via de la serie "que declara el repo que nada comprueba", y la unica que no cierra un hueco del codigo sino del INSTRUMENTO: hasta aqui las once anteriores cerraban una propiedad sin comprobar, y esta hace que el aparato que comprueba pueda volver a comprobar. Un instrumento que no puede dar verde otra vez no mide nada en cuanto se pone rojo. LA QUEJA NACIO EN WI-109, que la registro sin arreglarla, y la razon de no arreglarla era que el cambio exigia tocar .pipeline.kts. MEDIDO ANTES DE TOCAR NADA (.pipelinek/wi110_measure.py, sin mutar el arbol porque `evaluar()` es pura sobre InformeRun y lo dice en su docstring). M1: un run con un unico StepFailed produce ['sg_pipeline_run_failure', 'sg_pipeline_step_failed'], y la sonda —que los dos informes, fallo-de- evidencia y fallo-de-codigo, son indistinguibles para la funcion— da True. CAZADA. M2: `evaluar()` no mira el NOMBRE del paso que fallo: step_failed es un contador, y un contador no sabe quien fallo. M3, SOBRE EL JOURNAL REAL Y NO SOBRE NINGUNA TEORIA: 8d6a9594 (03:48:17) fue el ultimo run con las 8 etapas en success, y los cinco siguientes tuvieron las SIETE etapas de codigo en success y TODOS terminaron en failure. Un fallo ya corregido no devuelve la cadena a verde, porque el fallo deja de estar en el codigo pero sigue en el veredicto. LA MEDICION DESMINTO EL DIAGNOSTICO DEL BLOQUE ANTERIOR, y esto es lo mas importante del bloque: WI-109 escribio que el arreglo exigia tocar .pipeline.kts por el criterio de "los siete pasos pasaron" en vez de "el run termino en success". Era MEDIO VERDAD. El criterio no vive en la receta, vive en `evaluar()`; la etapa se limita a invocar el script y a propagar su exit code (.pipeline.kts:135). Por tanto el arreglo NO toca un byte de la receta, su SHA-256 sigue siendo 7541ced5, y las certificaciones de WI-101 a WI-109 siguen valiendo porque cada run se certifico con el verificador de su momento. Menos superficie, mas barato de verificar, y test_la_receta_no_cambio fija el digest para que nadie lo mueva sin querer. QUE CAMBIA. (1) `InformeRun.paso_fallido`: el NOMBRE del paso, leido de `stepName` del evento StepFailed. Es el cambio de fondo, porque sin el no hay base para exculpar. Valor por defecto `None` a proposito: el guard de WI-108 construye InformeRun con campos sueltos y un campo nuevo sin defecto revienta sus nueve tests — que es lo que paso, y se resolvio con el defecto y no tocando el guard anterior. (2) `ETAPA_AUTOEVALUADA` declarado como constante, no escrito dentro de `evaluar()`, para que un test pueda exigir que las dos copias no diverjan. Mismo patron que `SKIPS_PLATAFORMA` de WI-108. (3) `evaluar()` exculpa con TRES condiciones, no una: un solo StepFailed, con el nombre conocido, y que el nombre sea `evidence/`. Y el veredicto del run NUNCA se exculpa: un run abortado sin un solo StepFailed se rechaza igual. DOS ERRORES PROPIOS, y el segundo es el que cuesta mas caro de la serie. (1) MEDIDO: `startswith( ETAPA_AUTOEVALUADA)` sin la barra dejaba pasar `evidence-hack/sh-0`, y lo cazaron las ocho etapas del parametrize. La primera version de MI PROPIO comentario daba el `startswith` por bueno y describia el hueco como si fuera aceptable, con las palabras "sin el prefijo, una etapa llamada evidence-hack tambien pasaria". No lo era. Un comentario que describe un hueco sin cerrarlo es una promesa que el codigo no cumple, y escribirlo primero y cerrarlo despues es exactamente el reflejo que hace que el hueco exista. (2) CUATRO SONDAS DEL HARNESS APUNTABAN A TESTS MAL ESCRITOS y las contaba como victorias: pytest no encontro ninguno, salio con codigo 5 "no tests ran", y el harness leyo el returncode distinto de cero como "el guard fallo". Cuatro CAZADAS que no eran ninguna. El harness ahora distingue cuatro salidas con nombre — CAZADA, NO_DETECTADA, SIN_SONDA e INVALIDA — y las sondas se verifican una a una antes de contar. Es la misma regla de la serie aplicada al INSTRUMENTO: un harness que solo sabe decir "cazado" miente de la misma manera que un guard que solo sabe pasar. Mutaciones 11/11 cazadas, 0 invalidas, 0 sin sonda, restore verificado byte a byte. Guard: 22 tests con MAS tests para la mitad peligrosa —la que perdona de mas— que para la que arregla. Sin push.
  rationale_wi109: >-
      Bloque WI-109. SemVer derivado del historial: 1 feat, 0 fix, 0 breaking, 3 docs => MINOR. CALCULA scripts/derive_semver.py: b/f/x/n/d 0/1/0/3/0, la regla pide MINOR -> v0.22.0. DECIMA PRIMA via de la serie "que declara el repo que nada comprueba", y la primera cuya regla resulto ser MENOS violada de lo que la alerta suponia. La consigna era AGENTS.md 1.2 (prohibido `raise ValueError` / `raise Exception` en codigo de dominio) y la medicion la desmentio antes de tocar nada: `grep -rn 'raise ValueError|raise Exception' src/` devuelve CERO. La prohibicion literal SE CUMPLE. Anadirle un guard habria sido instrumentar una verdad que nadie puede romper, que es la peor version de un guard: uno que no puede fallar. LO QUE EL DOMINIO LANZA DE VERDAD, medido por AST y no por grep: TypeError x6, KeyError x5, RuntimeError x2, NotImplementedError x1, todos en invariantes internas de adaptadores (`unwrap()`, `dto.py`) y ninguno en el camino de error que ve el usuario. EL DEFECTO REAL ESTABA EN LA TERCERA VINETA de 1.2, que si era cierta y no instrumentada: "cada excepcion lleva un code estable (sg_*) usado por la CLI para traducir a exit codes". MEDIDO, con sonda de mutacion valida, en tres partes. (1) LA TRADUCCION NO EXISTIA: `runner.main` hacia `except SkillGraphError -> return EXIT_DOMAIN` (10) para TODO. EXIT_PARSE (11) y EXIT_VALIDATION (12) solo se alcanzaban porque cada comando repetia su propio `except ParseError` / `except ValidationError`: la decision la tomaba el TIPO en el sitio de la llamada, y el `code` se imprimia sin decidir nada. (2) ENTRADA DE USUARIO MALFORMADA SALIA COMO TRACEBACK: `knowledge compile <p> '{"obligatory": ['` devolvia rc=1 con el Traceback entero de json.JSONDecodeError impreso en stderr, porque el `json.loads(args.recipe)` estaba FUERA del `try` y JSONDecodeError no es SkillGraphError. Es un defecto que ve el usuario, no una hipotesis. (3) TRES CLASES COMPARTIAN `sg_error` (la raiz, SelfCertificationBlockedError, HandoffBlockedError) Y DOS COMPARTIAN `sg_invalid_expansion`. Un code compartido no puede mapear a dos exit codes distintos, y entonces el code deja de ser la clave: la traduccion prometida no se podia construir encima de el. QUE CAMBIA. (1) `exit_para(exc)` en `cli/exit_codes.py`: pura sobre `exc.code`, con la tabla code -> exit, y el modulo SIGUE SIN IMPORTAR NADA porque ADR-0016 lo movio ahi para que `parser.py` consuma el contrato sin arrastrar Storage; una traduccion en `runner.py` seria inalcanzable desde ahi y devolveria a la colision con el 2 de argparse. (2) `main()` cablea la traduccion, y un code desconocido cae en EXIT_DOMAIN, NUNCA en EXIT_OK: 0 significa exito, y un error de dominio que sale con 0 es peor que uno que sale con 10. (3) Los dos `json.loads` de entrada de usuario protegidos, convirtiendo la excepcion de la stdlib en `ParseError` con su code. (4) Los tres codes colisionados, con code propio. (5) Las tres ramas de `cmd_knowledge_compile` que devolvian EXIT_DOMAIN LAS TRES: no distinguian nada, solo parecian distinguir. MEDIDO CON EL BINARIO: rc=1 + Traceback -> rc=11 + `ERROR (sg_parse)`. Los errores de dominio no distinguibles siguen en 10, que es exactamente lo que afirman 16 tests que ya existian: cambiarlo hubiera roto un contrato as-built bien observado, y la regla de este bloque es no cambiar comportamiento observable que no sea el defecto. DOS ERRORES PROPIOS, y el segundo es el que mas cuesta. (1) La primera version de `test_main_usa_la_traduccion_y_no_el_catch_all_a_pelo` buscaba la cadena `return EXIT_DOMAIN` en el texto de `main()` y se puso ROJA POR SU PROPIO COMENTARIO: el comentario que explica por que se sustituyo contiene esa cadena. Es la regla de la serie por TERCERA vez en tres semanas (WI-98 con rutas absolutas, WI-108 con el patron de `pytest.skip`) y por el mismo motivo exacto: un guard que busca una cadena busca la cadena. Se reescribio sobre AST, que es donde vive la propiedad "no hay un return con ese valor". (2) La sonda de la mutacion M6 no cazo, y la senal fue que M6 NO LA CAZO, no que el guard estuviera roto: investigar dio que `code = "sg_error"` es una COLISION (la clase declara code, solo que el mismo que otra) y no una HERENCIA (que es no tenerlo en `__dict__`), y cada propiedad tiene su test. Se corrigio la sonda Y se anadio M6b para la herencia. 11/11 mutaciones cazadas. NO SE ABRE FRENTE a lo que la medicion dejo fuera: los 14 raises de builtins, ni las 4 funciones con ramas que devuelven el mismo exit code. Sin push.
  rationale_wi108: "Bloque WI-108. SemVer derivado del historial: 0 feat, 2 fix, 0 breaking => PATCH. CALCULA scripts/derive_semver.py: b/f/x/n/d 0/0/1/4/0, «la regla pide PATCH -> v0.21.2». DECIMA via de la serie «que declara el repo que nada comprueba», y la mas pequena en codigo: una prohibicion de siete palabras con su porque escrito al lado. AGENTS.md 6.2 dice «NO usar pytest.skip para esconder fallos: o arreglas el test o lo borras» y «un skip por falta de artefacto es el mismo defecto, con otra forma»; la segunda la escribio WI-103 midiendo un gate que se saltaba por falta de informe. Y no habia NADA que la comprobara: instrumentos que miran skips en scripts/ y src/ = 0, etapas de la receta que los miran = 0. MEDIDO antes de tocar nada, con un run sintetico cuyo unico cambio es la linea de resumen del journal: run sin skips da 0 problemas, run con 3 skipped da 0 problemas, y el veredicto imprime «OK: el run cumple los criterios que declara AGENTS.md». Y EL DETALLE QUE LO HACE GRAVE no es el regex: es que el CRITERIO 2 —el que existe para distinguir un run real de un veredicto cacheado— acepta un resumen con skips, porque la pregunta por los skips no se habia hecho. Una regla y el criterio que la vigila no se contradicen cuando nunca se cruzan. LA REGLA LA INCUMPLIA EL AUTOR DE LA REGLA: de los cinco skips que habia, dos son de plataforma (fcntl no existe en Windows, no esconden un fallo) y TRES son de artefacto —«sin journal: clon nuevo»—, que es literalmente lo que la segunda linea prohibe. Los escribi yo en WI-105, en el guard que construi para no esconder nada. QUE CAMBIA. (1) sg_pipeline_tests_skipped en scripts/check_pipeline_receipt.py, que la etapa evidence mide porque es donde ya se comprueban los criterios; cuenta skipped y xfailed, que son la misma propiedad con dos nombres, y pregunta por el VALOR y no por la presencia, porque «0 skipped» es un run limpio y un guard que mirara «hay skipped» trataria una linea buena como un incumplimiento. (2) Los 3 skips de artefacto se van Y NO SE SUSTITUYEN POR NADA: median el ENTORNO —que paso en esta maquina— y no el ENTREGABLE —que garantiza el guard—, el journal no esta versionado, asi que en un clon nuevo se saltaban en silencio y la suite pasaba en verde con skips. Sus tres propiedades ya tienen sitio: dos en la etapa evidence en cada run, una sintetica desde WI-105. La tabla de donde vive cada una esta en el propio fichero donde estaban, con la clase renombrada a TestLaClaseDeTestQueVivioAQui. (3) SKIPS_PLATAFORMA declara los 2 legitimos y se vigila en las DOS direcciones: uno nuevo sin declarar es un incumplimiento y uno declarado que se borra deja la regla sin suelo. Vigilar solo en una direccion deja de ser vigilar, y es el mismo caso que una desviacion de cobertura que apunta a un fichero borrado (WI-107). (4) EL GUARD QUE MIRA EL CODIGO MIRA EL AST, NO EL TEXTO. La primera version buscaba pytest.skip( con regex y se puso roja POR SU PROPIA DOCUMENTACION: un docstring que cita el patron es indistinguible de una llamada. Es la regla de la serie —«un guard que busca una cadena busca la cadena, no la propiedad»— y aparece por segunda vez en dos semanas en el mismo repositorio y por el mismo motivo. Dos tests fijan la distincion con los dos lados. LIMITE DECLARADO y escrito: from pytest import skip seguido de skip() no lo ve el AST porque el nombre ya no es pytest.skip. (5) 6.2 dice ahora COMO se comprueba y donde, en una tabla con las dos propiedades y los dos sitios, porque una prohibicion sin verificador es una declaracion. MUTACIONES 9/9 EN TRES PASADAS, con sonda por mutacion desde el principio: es el patron que WI-107 necesito dos intentos para conseguir. La primera sonda de M5 —cambiar el codigo del error a uno que nadie espera— no la cazo porque media la forma de retorno de un arbol SIN llamadas, donde esa forma nunca se ejerce: la mutacion era invalida y el harness lo dijo en vez de acusar al guard. CI: run 2387c4cc-c624-4793-a8ef-1a83f3df72ea, 2735 passed in 241.57s, 0 skipped, 8/8 etapas, global 95.22 %, cli/ 86.91 %, runtime/ 97.98 %, verificado por run_id. Sin push."
  rationale_wi107: "Bloque WI-107. SemVer derivado del historial: 0 feat, 1 fix, 0 breaking => PATCH. CALCULA scripts/derive_semver.py: b/f/x/n/d 0/0/1/8/0, «la regla pide PATCH -> v0.21.1». NOVENA VIA de la serie «que declara el repo que nada comprueba», y la TERCERA vez que la misma idea se salva de si misma cambiando de forma. AGENTS.md 6.3 declara suelos de cobertura por modulo, y su guard lleva tres versiones, cada una creyendo que era la ultima: WI-93, una lista de 21 modulos escritos a mano, que solo vigilaba runtime/; WI-94, un suelo por prefijo de paquete con OCHO entradas escritas a mano, cuyo docstring afirmaba que con eso «no se puede olvidar uno»; WI-107, ninguna. MEDIDO antes de tocar nada, con un paquete nuevo (telepatia/) con codigo que nadie importa y YA VERSIONADO en git: pytest daba 2709 passed in 234.75s, check_coverage_floors.py daba exit 0 con «todos los suelos se cumplen», oracular.py media 0 % (18 sentencias, 10 ramas, 0 cubiertas) y el suelo global seguia en 94.85 %. SE MIDIO DOS VECES Y LA SEGUNDA ES LA QUE SE CITA, porque la primera daba un resultado mas fuerte y FALSO: con el paquete sin versionar la suite daba 1 failed, y el rojo era sg_build_sdist_no_versionado (WI-97), que lo delata porque un sdist no puede llevar lo que git no versiona. Ese guard lo ve, pero por OTRA propiedad y con OTRO mensaje, y un paquete nuevo se versiona: no es el contrato de 6.3, es otra puerta que se abre por casualidad. Escribir solo la version sin versionar habria producido la afirmacion «el repo entero es ciego ante un paquete sin suelo», que es la que no se escribe. EL +6 respecto a 2703 se midio por diferencia de la lista de tests colectados, no estimado: son los seis tests parametrizados de test_wi47_broad_except_guard.py, que SI derivan del arbol. El repo ya tenia guards que descubren ficheros nuevos; este era uno de los que no. QUE CAMBIA: SUELO_POR_DEFECTO = 90 alcanza a todo modulo que cuelgue de un subdirectorio de src/skillgraph/, paquete nuevo incluido, sin que nadie lo declare; lo escrito son las DESVIACIONES, que son datos y no se deducen del arbol (cli/ al 70 %, platform/paths.py al 60 %). De ocho entradas a dos. La asercion de WI-94 cambia de objeto en vez de desaparecer: vigilar que los ocho paquetes declarados tengan modulos es tautologico con suelo por defecto porque los paquetes se derivan del arbol, y lo que puede quedarse viejo es la desviacion. src/skillgraph/__init__.py y __main__.py no cuelgan de un subdirectorio y estan en omit de pyproject, asi que no se gobiernan, y ahora lo dice una funcion (_cuelga_de_paquete) que se puede probar sola. AGENTS 6.3 DEJA DE ENUMERAR MODULOS: «errors, bricks, parser, registry, storage, runtime, handoff, agent, workflow, runcontroller» era una fuente de verdad mas y ya estaba vieja —runtime no es un modulo sino un paquete, runtime.py no existe, y nueve de los diez vivian fuera de core/. LA REGLA QUE SALE DE AQUI, escrita como tal: si el dato se deduce del arbol, no se escribe; si no se deduce, se declara, y declararlo incluye vigilar que lo declarado exista. LO QUE NO SE ARREGLA Y SE DECLARA: scripts/coverage.sh sigue siendo una instrumentacion de la suite y .pipeline.kts la corre en un stage, asi que el suelo se comprueba sobre una medicion que el propio CI produce. DOS HALLAZGOS QUE SALIERON DE LAS MEDICIONES Y NO DE UN TEST. (1) El primer guard de 6.3 PASABA POR LA RAMA EQUIVOCADA: buscaba «nombre.py» y 6.3 escribe los modulos SIN extension, asi que el extractor no encontraba nada y el test era decorativo. Es la trampa de WI-104 del reves: alli tres contraejemplos pasaron por la rama incorrecta, aqui el test entero pasaba por ella. Se sustituyo por un predicado puro _modulos_enumerados() probado PRIMERO contra un texto escrito en la forma real de 6.3, mas un segundo predicado _existe_como_fichero() que distingue un modulo de un paquete. (2) Un contraejemplo mio usaba como «paquete que no existe» el nombre del paquete de la medicion, de modo que con el paquete presente _base() lo recogia, el prefijo declarado aportaba algo y el test se ponia rojo: 1 failed, 2724 passed. Un guard que depende del arbol sin decirlo es una coincidencia, y un contraejemplo tiene que ser incapaz de aparecer por si solo. Lo destapo la medicion post, que es la mejor forma que tiene de aparecer un defecto asi. LA MUTACION QUE A VECES SOBREVIVIA, y por eso el harness cambio: primera pasada 6/8 con m2 sobrevivida, segunda pasada del MISMO codigo 7/8 con m2 cazada. Una mutacion que a veces sobrevive no es un guard que no muerde: es un experimento que no sabe que midio. Con PYTHONDONTWRITEBYTECODE=1 y una SONDA por mutacion —una expresion que tiene que cambiar de valor con el codigo ya mutado— las tres salidas tienen nombre: cazada, invalida (la sonda no cambio, la mutacion no degradaba nada; M5 en su primera version quitaba una cabecera de texto y no la asercion, y el harness viejo la contaba como «el guard no muerde», una acusacion falsa) y entorno-no-vio-la-mutacion (la sonda se evalua sobre el codigo viejo, y sin esa categoria el harness acusa al guard de lo que hizo el entorno). MUTACIONES 8/8 EN TRES PASADAS CONSECUTIVAS, arbol restaurado byte a byte en las tres, y el paquete de la medicion fuera del indice y del arbol. CI: run 332e09e6-ba0b-449e-908e-9686dd35a898, 2718 passed in 238.86s, 0 skipped, 8/8 etapas, cobertura global 95.22 %, cli/ 86.91 %, runtime/ 97.98 %, verificado por run_id con scripts/check_pipeline_receipt.py. 2718 passed y 0 SKIPPED (+15). Sin push: 150 commits sin publicar, origin/main en 0ebbd58."
  rationale_wi106: "Bloque WI-106. SIN RELEASE, Y POR REGLA: los cinco commits desde v0.21.0 clasifican como neutro —ni feat ni fix— asi que scripts/derive_semver.py dice SIN RELEASE, y AGENTS.md 12 es explicito: «si la regla dice sin bump, no se emite etiqueta: el trabajo se acumula». Es el primer bloque de la serie que no libera, y es la regla siguiendo, no la regla saltandose. OCTAVA via de la serie «que declara el repo que nada comprueba», y la mas pequena: un solo campo. STATE.yaml declara POR QUE se movio la version (release.semver_bump) y scripts/derive_semver.py la CALCULA; nadie los comparaba. El campo aparecia en un sitio y en dos informes de audits/, y ningun test lo leia. MEDIDO con .pipelinek/wi106_measure2.sh, STATE.yaml restaurado byte a byte con sha verificado: puesto el campo a MAJOR cuando el release fue MINOR, la suite de gobernanza de release daba 18 passed, exit 0, y los tres checkers de la receta y el bundle de auditoria, tambien exit 0. Una afirmacion falsa sobre la causa de un bump, invisible para todo el repo. Con el guard puesto, la misma mentira da 2 failed, exit 1. LO QUE YA ESTABA VERIFICADO: el nivel de la version, porque test_wi96_semver_rule.py vigila que la lista de divergencias historicas no crezca. Lo que no exigia nadie es que el campo dijera la verdad. DOS TRAMPAS, y las dos las destapo que las mutaciones sobrevivieran: la primera version daba 4/6. (1) Comparar contra una CONSTANTE ESCRITA A MANO en vez de la herramienta: hoy la copia dice lo mismo que la verdad y el test pasa verde, y el dia que la regla cambie dira lo contrario con toda la autoridad de un test. Un guard que compara contra su propia copia no vigila nada. Se corrige exigiendo que el calculo acierte en DOS BUMPS DISTINTOS, cosa que un literal no puede. (2) Comprobar el DOMINIO sobre el valor de hoy: que MINOR sea valido no es que el dominio exista, y anulada esa comprobacion el test seguia verde. Se extraen _bump_valido y _etiqueta_existe como predicados puros, y se les llama con RELLENO, la cadena vacia, «minor» y v9.9.9. (3) El tercer test DUPLICABA al primero: dos copias de la misma asercion no son redundancia, son decoracion, porque una sobrevive a que borren la otra. Se sustituyo por una propiedad distinta. M1 (borrar la asercion que manda) NO se cuenta como fallo: es indetectable por construccion, y un test que comprueba que el estado coincide con la herramienta no puede comprobar que sigue ahi. Lo que se mide es su interaccion con M6, y con M1 puesta el estado puede mentir y NADIE lo ve, que es la demostracion de que era el unico punto de aplicacion. Contarlo como fallo seria inventar una propiedad que no existe; esconderlo seria mentir sobre la cobertura. M6 muta el STATE.yaml REAL: un invariante que solo sabe fallar con entradas inventadas esta limpio en las pruebas y ciego en el repo. MUTACIONES 6/6, tercera tanda consecutiva que sale a la primera. DOS HIPOTESIS MEDIDAS Y FALSAS, escritas para que el camino descartado tambien sea evidencia: (a) que el pre-push comprobara el CI con un grep sobre el stdout — FALSO, usa el exit code de scripts/ci.sh, y ese script pasa --rerun, asi que es inmune al veredicto cacheado; (b) que los cuatro UAT stub de _STUB_UATS pudieran desaparecer en verde — FALSO, WI-101 lo cerro, y --verify da exit 1 con persistido=MISSING. 2703 passed y 0 SKIPPED (+4). Sin push."
  rationale_wi105: "Bloque WI-105. SemVer derivado del historial: 1 feat, 1 docs, 0 fix, 0 breaking => MINOR. CALCULA scripts/derive_semver.py: «la regla pide MINOR -> v0.21.0». SEPTIMA via de la serie «que declara el repo que nada comprueba», y la mas amplia: no un instrumento mal, sino SEIS CRITERIOS ESCRITOS QUE NADIE COMPROBABA. AGENTS.md («CI Local Obligatorio») enumera seis criterios que un run «debe cumplir». La etapa evidence de .pipeline.kts era el unico sitio de la receta que tocaba .pipelinek/, y sus tres comandos NO PODIAN FALLAR: ls del journal, y dos test -d sobre directorios que el motor crea ANTES de la etapa. MEDIDO contra el journal real de este repo: 15 runs, 3 de ellos RunFinished/failure, y la etapa imprime «last-run present» y «workspace tracking present» en los QUINCE, indistinguibles. Es la forma de WI-101 —una etapa que certifica sin ejecutar la comprobacion— aplicada al registro del propio CI. El alcance era mayor: el unico criterio referenciado en algun sitio es el 1, con un grep sobre el stdout dentro de scripts/hooks/pre-push, que no esta instalado y cuyo grep ya se comio esa cadena exacta una vez en la historia del repo. LO QUE SE COMPRUEBA: los criterios 1, 2, 3, 4 y 5, que son propiedades del journal y del arbol. EL 6 NO, y se declara: es el SHA-256 «registrado en la sesion», y una sesion es del agente, no del repo; meterlo en el script habria sido la misma mentira que el script viene a arreglar. EL CONTRAEJEMPLO QUE MANDA no es el run rojo, es el run VERDE QUE NO EJECUTO NADA: un veredicto cacheado y una verificacion real dicen los dos «Pipeline finished with SUCCESS», y AGENTS.md describe el caso con sus palabras —«sin --rerun, un run cuyo script no ha cambiado reutiliza el veredicto previo y termina en Pipeline finished with SUCCESS sin ejecutar un solo step»—. El criterio 2 existe para separarlos y era el unico modo de fallo que nada distinguia. POR QUE VERIFICA EL RUN ANTERIOR: la receta no puede verificar su propio run, porque cuando la etapa corre el run en curso aun no tiene RunFinished. El huevo y la gallina es real, no una excusa, y lo resuelve el propio motor: el RunFinished mas reciente es, durante un run, el run anterior. El mismo script con --run-id verifica uno concreto, que es lo que hace la certificacion. Sin journal no hay nada que verificar y se pasa con un mensaje, porque en un clon nuevo .pipelinek/ no esta versionado y exigir un run haria la receta inejecutable donde no puede ser ejecutable. UN DETALLE DE INSTRUMENTO CUESTO UNA MEDICION ENTERA: el payload del journal es una LISTA JSON con un dict dentro, no un objeto. json_extract(payload, '$.outcome') devuelve NULL sobre ese schema, y leerlo por la ruta de objeto daba None en los 15 RunFinished — el run mas sano del repo habria salido como failure. Un instrumento que no abre el contenedor no mide lo que cree medir, y el sintoma (un None silencioso en 15 filas) parece un dato, no un fallo. C5 (WI-102) exigio enchufar el checker en la receta: sin eso el contrato se rompe solo, y eso es el guard funcionando. MUTACIONES 7/7 A LA PRIMERA (.pipelinek/wi105_mutate.sh + wi105_muts/m1..m7.py), sin la segunda pasada que hizo falta en WI-104 porque cada test exige el CODIGO del problema y no solo que la lista no este vacia — exigir solo «hay problemas» es lo que dejo pasar a tres contraejemplos en WI-104. M7 degrada la CONEXION sobre el .pipeline.kts real y lo que debe morder es C5 de WI-102, no un test de este bloque. M6 funde las dos mitades del criterio 2 en un codigo, porque un solo codigo haria decir «veredicto cacheado» a un run que SI ejecuto pasos: un guard que senala de mas entrena a su lector a ignorar sus avisos. 2699 passed y 0 SKIPPED (+15). Sin push: 136 commits sin publicar, origin/main en 0ebbd58."
  rationale_wi104: "Bloque WI-104. SemVer derivado del historial: 0 feat, 1 fix, 1 docs, 0 breaking => PATCH. CALCULA scripts/derive_semver.py: b/f/x/n/d 0/0/1/1/0, que dice literalmente «la regla pide PATCH -> v0.20.5». SEXTA via de la serie «que declara el repo que nada comprueba», y la mas silenciosa: no un instrumento que mide mal, sino uno que NO PUEDE DISTINGUIR una afirmacion verdadera de otra falsa. EL DEFECTO ES PROPIO, MEDIDO EN WI-102 Y ANOTADO DOS VECES: test_toda_cita_del_bloque_vivo_resuelve aceptaba como valida CUALQUIER linea que existiera, porque su unico predicado era linea <= total_lineas. Yo escribi en CURRENT.md la linea 352 y la 479 de scripts/check_ci_recipe_parity.py cuando las reales eran la 421 (checkers_de) y la 589 (evaluar_contratos_de_la_receta). Las cuatro lineas existen hoy y el guard dio las cuatro por buenas. MEDIDO con .pipelinek/wi104_measure.py (SOLO LECTURA, cinco casos, con la verdad al lado): el predicado actual acepta las dos citas falsas; el de sitio de definicion las separa con CERO errores. La razon es concreta: 352 y 479 son PROSA dentro de un docstring —filtra_por_ficheros y evaluar_portabilidad—, y 421 y 589 son lineas def. Eso es resolubilidad, no verdad. LA CAUSA RAIZ NO ES EL NUMERO: es que con solo un numero no hay manera de distinguir «he abierto el fichero» de «he escrito un numero que me sonaba», y por eso el error se colaba sin que nada lo notara. EL ARREGLO ES HACER LA AFIRMACION FALSABLE: el formato pasa a ruta/fichero.py:LINEA::simbolo. El simbolo se resuelve en el AST del FICHERO QUE LA CITA NOMBRA —no en cualquiera del repo, que es el fallo de resolver por basename— y LINEA tiene que caer dentro de su definicion. Cuando una cita se queda vieja porque alguien inserto una linea arriba, el error DICE DONDE ESTA EL SIMBOLO AHORA: un verificador que dice «falso» sin decir «esta aqui» deja al que corrige en un callejon sin salida, y eso es la mutacion M5. LA CITA APUNTA A LA DEFINICION QUE CONTIENE LA COSA, no a una linea de cuerpo; es lo que ya hacian todas las citas alive. LO QUE NO SE COMPRUEBA, declarado: que la prosa describa de verdad el simbolo no es machine-checkable. El guard baja la lifetime de la afirmacion de «esta linea existe» a «esta linea introduce el simbolo que la cita nombra y el simbolo existe en ese fichero» — una propiedad real y verificable, pero no la prosa. EL CONTRAEJEMPLO ES PARTE DEL ARREGLO, Y HUBO QUE ARREGLARLO DOS VECES. Seis mutaciones, todas en rojo (.pipelinek/wi104_mutate.sh + wi104_muts/m1..m6.py), y M6 degrada la AFIRMACION sobre el CURRENT.md real, no sobre un informe sintetico: un invariante que solo sabe fallar con entradas inventadas esta limpio en las pruebas y ciego en el repo. PERO LA PRIMERA PASADA DIO 3/6, y las tres que sobrevivieron eran CONTRAEJEMPLOS QUE PASABAN POR EL MOTIVO EQUIVOCADO, no contraejemplos debiles: (1) test_linea_real_con_simbolo_equivocado_falla usaba «cargar_auditor», que NO ES UN SIMBOLO —se llama _cargar_auditor—, asi que la prueba no media la desalineacion sino la rama de «no lo define», y la mutacion M1, que apaga justo la comprobacion de linea, pasaba verde. (2) La regla del ancla se comprobaba sobre _citas_vivo(), que NUNCA produce una cita sin ancla, de modo que relajar la regla DENTRO del verificador —M3, la mas probable porque no rompe nada visible— pasaba sin que nada lo notara; se arreglo sacando _problemas_del_bloque, que verifica una lista de citas cualquiera, y pasando por ahi una cita sin ancla. (3) Resolver el simbolo en todo el repo (M4) daba el error equivocado sin que ninguna prueba lo notara; ahora el test exige que el error senale EL FICHERO que deberia definirlo. Un contraejemplo que no degrada nada no prueba que el guard funcione, y tres de seis no median lo que decian medir. EL GUARD ATRAPO AL AUTOR AL ESCRIBIR EL BLOQUE VIVO: al contar el fallo anterior usando el patron fichero.py:352, el guard lo leyo como una afirmacion y lo rechazo. Es lo correcto —un bloque que cuenta un error usando el formato del error se contradice a si mismo— y la regla queda escrita: el bloque vivo cita el codigo de hoy, la arqueologia va al CHANGELOG. 2684 passed y 0 SKIPPED (+7 sobre 2677). Sin push: 128 commits sin publicar, origin/main en 0ebbd58."
  rationale_wi103: "Bloque WI-103. SemVer derivado del historial: 0 feat, 1 fix, 0 test/docs, 0 breaking => PATCH. CALCULA scripts/derive_semver.py: b/f/x/n/d 0/0/1/0/0. QUINTA via de la serie «que declara el repo que nada comprueba», y la mas discreta: no un instrumento que mide mal, sino uno que NO LLEGA A MEDIR y da verde. APARECIO POR LA RE-CERTIFICACION de WI-102, que dio 2672 passed + 1 skipped donde el codigo habia dado 2673 sin skips: la fecha rolo a 2026-10-03 y el informe de ese dia no existia. TestAuditGateForMain declara una propiedad sobre el CODIGO —«main no debe listarse como hotspot publico, cc>=20»— y la comprobaba leyendo audits/architecture-debt-<HOY>.md, con pytest.skip si no existia. MEDIDO con restauracion de audits/ verificada por sha (.pipelinek/wi103_measure.sh): sin informe de hoy SKIPPED exit 0; con informe de hoy generado 1 passed (hoy main no es hotspot); con main inyectado en la seccion de hotspots del informe 1 FAILED exit 1. LA PROPIEDAD ES REAL Y EL GATE MUERDE CUANDO EL ARTEFACTO ESTA; EL DEFECTO ES LA EXISTENCIA DEL ARTEFACTO: 6 informes architecture-debt-* en 7 dias (falta el 2026-09-30) y hoy ninguno. Un gate que solo corre cuando alguien se acuerda de correr el auditor no es un gate: es un registro de que alguien lo corrio. AGENTS.md 6.2 dice literalmente «NO usar pytest.skip para esconder fallos». EL ARREGLO ES QUE EL GATE MIDA: tests/_gate_main_hotspot.py::hotspots_publicos(arbol, *, out_dir) ejecuta audits/audit_debt.py con --src-root sobre el arbol que se le pase y --out-dir a un temporal. Ambos son parametros desde WI-89, que los hizo parametros precisamente para que un test pudiera auditar sin mutar audits/, que tiene 51 FICHEROS VERSIONADOS. El analisis se hace con el propio auditor y no con una cuenta propia: reimplementar la metrica seria tener dos verdades sobre que es un hotspot, y la segunda dejaria de coincidir con la primera el dia que el umbral cambie. GANA TRES COSAS: siempre activo (no depende de la fecha), siempre fresco (antes validaba un snapshot de la ultima vez que se corrio) y sin efectos secundarios. EL CONTRAEJEMPLO ES PARTE DEL ARREGLO: sin un test que ponga un main real de cc>=20 en un arbol y exija que la medicion lo vea, una medicion que devolviera siempre () habria pasado todo verde — indistinguible de la que no mide nada. Un gate que solo sabe pasar no esta probado. M2 es exactamente esa degradacion. UN GUARD QUE SE ESCRIBIO MAL DE LA PRIMERA: el que prohibia el skip buscaba la cadena 'skip' en el fuente del modulo y se ponia en rojo POR SU PROPIO DOCSTRING, que explica el defecto que arregla. Un guard que busca una palabra encuentra la palabra, no la propiedad. Reescrito sobre el ARBOL DE SINTAXIS: un modulo que no importa pytest no puede llamar a pytest.skip. M3 reintroduce el skip por la puerta de atras —dentro del helper, un nivel mas abajo— y el guard lo ve. MUTACIONES 5/5 (.pipelinek/wi103_mutate.sh + wi103_muts/m1..m5.py). M1 y M2 son degradaciones por INCAPACIDAD, no por ignorancia: el guard sigue leyendo ficheros y ejecutando el auditor, y su veredicto es el correcto para un umbral o una medicion que nadie alcanza. Un guard que no puede fallar es indistinguible de uno que aprueba todo. M5 deshace en una linea el parametro de WI-89: con out_dir posicional, un llamador nuevo puede auditar y escribir en audits/, que esta versionado. 2677 passed y 0 SKIPPED en la CI canonica, run 9db8a440-1031-4c4a-98c9-3fee571c9999, 0 StepFailed. Antes 2672 passed + 1 skipped: la diferencia no es un test nuevo, es el MISMO test que antes no se ejecutaba. Sin push."
  rationale_wi102: "Bloque WI-102. SemVer derivado del historial: 0 feat, 2 fix, 0 test/docs, 0 breaking => PATCH. CALCULA scripts/derive_semver.py: b/f/x/n/d 0/0/2/0/0. TERCER workitem de la serie «que declara el repo que nada comprueba», y el mas serio: no era un script que midiera mal, era el instrumento que CERTIFICA los contratos y que no comprobaba que los contratos estuvieran. MEDIDO con el comando canonico de verdad (script autocontrolado, backup byte a byte, sha256 verificado al salir, .pipelinek/wi102_measure.sh): se borro el bloque entero de la etapa coverage-floors de .pipeline.kts —la que impone los suelos que AGENTS.md 6.3 declara exigibles— y el resultado fue check_ci_recipe_parity.py exit 0 («OK: ...»), pytest test_wi98_ci_recipe_parity 37 passed, y la RECETA EJECUTADA DE VERDAD con Pipeline finished with SUCCESS. Cero menciones de coverage-floors en su salida, cero de su VEREDICTO de suelos. Una etapa borrada, ninguna rotura: una receta que ejecuta menos se ejecuta igual de bien. CAUSA: evaluar_etapas (C3) comprobaba que etapas_canonicas fuera LEGIBLE, y una lista de etapas vacia por legibilidad es tan valida como una completa. Leer del script es correcto —es lo que evita un guard que vigila su propia lista—, pero LEER y EXIGIR son dos cosas y solo se implemento la primera. C4 exigia que quien ejecuta pytest este CONECTADO a la receta; nadie exigia que la receta CONTENGA los contratos. Conectar sin contener, y contener sin conectar, fallan igual. C5: todo scripts/check_*.py lo invoca la receta canonica. LA FORMA ES SIN LISTA A PROPOSITO: el conjunto sale del repo, no de una constante, porque una lista de contratos obligatorios dentro del guard es la misma trampa que DIRECTORIOS_NO_RECETA en WI-99 —obliga a mantener enumerado lo que el guard deberia comprobar solo, y ese mantenimiento es el trabajo que se quiere automatizar—. Asi un checker nuevo entra en el contrato el dia que se escribe, y borrar una etapa se detecta porque el checker que invocaba deja de estar invocado. Cubre tambien el caso INVERSO, que hasta WI-102 era invisible: escribir un checker y no enchufarlo en la receta, que es un guard que no guarda nada con la misma forma exacta que un guard real. LO QUE NO CUBRE, declarado y no disimulado: el descubrimiento es por la convencion check_*.py; un contrato escrito con otro nombre queda fuera, igual que un script sin extension quedaba fuera de C3 antes de WI-100. VERIFICADO DESPUES DEL ARREGLO, MISMA MUTACION: guard exit 1 con el nombre del checker huerfano, 3 tests en rojo, y LA RECETA ELLA MISMA Pipeline finished with FAILURE — la receta se detecta a si misma, porque el stage ci-parity corre el checker, el checker sale con 1 y la etapa falla. Mutaciones 6/6 (.pipelinek/wi102_mutate.sh + wi102_muts/m1..m6.py). M6 es la contrapueba que hace este bloque distinto: vuelve a borrar la etapa en el FICHERO REAL y exige rojo, porque un invariante que solo sabe fallar con informes sinteticos esta limpio en las pruebas y ciego en el repo. M5 es la unica que produce un FALSO POSITIVO: el lector sin subdirectorios senala como huerfano un contrato que la receta ejecuta, y un guard que senala equivocado entrena a su lector a ignorar sus avisos. EL GUARD DE CITAS COMPRUEBA RESOLUBILIDAD, NO VERDAD (medido, no arreglado): test_toda_cita_del_bloque_vivo_resuelve acepta una cita que apunte a una linea existente pero distinta de la que el texto afirma. Las primeras citas del bloque vivo apuntaban a :352 y :479 en vez de :421 y :589 y el guard las dio por buenas. Una certificacion DESCARTADA: el run bbf59e06 termino en SUCCESS mientras las mutaciones reescribian la receta; editar durante la certificacion la invalida, porque nadie sabe que ficheros leyo el pytest de dentro. Se repitio sobre el arbol quieto: run efebb07c, 8/8 stages, 2673 passed, 0 StepFailed. Sin push."
  rationale_wi101: "Bloque WI-101. SemVer derivado del historial: 0 feat, 1 fix, 1 docs, 0 breaking => PATCH. CALCULA scripts/derive_semver.py: b/f/x/n/d 0/0/1/1/0. WI-99 CERTO LA EVIDENCIA DE AUDITORIA COMO REPRODUCIBLE, y lo que hizo fue hacer el bundle reproducible, no verificador: scripts/audit_bundle.sh, que existe PARA dar evidencia a una auditoria independiente, invocaba «python -m tests.uat_audit» sin flags, que es el MODO LECTURA — no ejecuta un solo UAT y relee los 26 JSON de tests/uat-evidence/. El PASS=16 del bundle de WI-99 se escribio mirando ficheros del commit 0ebbd58, 111 commits por detras. Y DEBAJO habia algo peor: el modo lectura hacia «return 0» INCONDICIONAL (linea 1949 del arbol previo), de modo que el exit code estaba estructuralmente desacoplado del veredicto y la guarda del bundle —«if [ $UAT_RC -ne 0 ]»— no podia dispararse NUNCA por el estado de la evidencia. MEDIDO con el comando exacto del bundle, con backup byte a byte y sha256 verificado al salir (.pipelinek/wi101_measure.sh): con UAT-01.json inyectado en FAIL imprime PASS=15 FAIL=1 y sale con 0; con tests/uat-evidence/ ausente imprime PASS=0 FAIL=0 y sale con 0. Un bundle con un FAIL a la vista y un bundle sin una sola evidencia eran INDISTINGUIBLES de uno sano. Un exit code fijo no es un guard: es un mensaje con codigo de salida. QUE SE ARREGLAN, tres cosas que son una sola propiedad: (1) el exit code sale de _verdict, compartido por los tres modos (lectura, --dry-run/--write, --verify) para que no puedan divergir entre si; lista BLANCA de estados certificables (PASS, BLOCKED) y no negra, porque el conjunto de cosas malas no tiene fin. (2) --verify: ejecuta los UATs, NO persiste, y confronta cada veredicto con la evidencia persistida; sin ese contraste la evidencia era la unica fuente del veredicto y no se contrastaba con nada, asi que podia afirmar PASS para un UAT que hoy falla sin que nadie se entere. (3) El resumen cuenta los veredictos fuera de dominio en vez de tragarselos. (2) y (3) los destapo el PRIMER TEST del bloque, no una revision: con status «passed» el resumen imprimia PASS=15 FAIL=0 BLOCKED=0 sobre 16 filas leidas — un numero cierto letra a letra y estar mal, y 15+0+0 no es 16. Un total que no suma las filas no es un total. VERIFICADO DESPUES DEL ARREGLO, NO ANTES: los 16 UAT se ejecutan de verdad y CONVERGEN con la evidencia versionada (exit 0). La evidencia era cierta; lo que faltaba era comprobarlo. Mutaciones 9/9 (.pipelinek/wi101_mutate.sh). M8 es el contraejemplo de la serie — quita --verify de la orden real y lo deja SOLO en un comentario: el guard tiene que seguir viendo el modo lectura, porque un guard que se deja enganar por una mencion pasa en verde (es lo queConfirmo M7 de WI-100). Y M4 ENCONTRO UN TEST CONFUNDIDO: apuntaba al caso espejo (evidencia PASS / ejecucion FAIL) y se quedaba VERDE, porque con la ejecucion en FAIL el veredicto ya es 1 y el test no podia distinguir la divergencia de un FAIL sencillo. Anadido el caso no confundido. FALLO DE AUTOCONTROL REGISTRADO: la primera version del script de mutaciones tenia «rm -rf BAK» DENTRO de restaurar(), asi que la primera restauracion se llevo el backup y las seis siguientes no restauraron nada — las mutaciones se acumularon sobre el arbol y hubo que revertirlas a mano. Autocontrol que se degrada en silencio no es autocontrol. NO SE REGENERA LA EVIDENCIA PERSISTIDA: los 26 JSON siguen con revision cb7e348 y timestamp 2026-09-23 porque son provenance, no una copia del presente. 2661 passed en la CI canonica, run e5d046af-07e6-4cdf-910c-8bbd7c8f36b1, 0 StepFailed, cobertura 95.22 %, sha256 de .pipeline.kts identico a WI-98 y WI-100. Sin push."
  rationale_wi100: "Bloque WI-100. SemVer derivado del historial: 0 feat, 3 fix, 3 test/docs/chore, 0 breaking => PATCH. CALCULA scripts/derive_semver.py: b/f/x/n/d 0/0/3/3/0. WI-99 dejo escrito, en dos sitios, que scripts/hooks/pre-push era DEUDA MEDIDA: mide con un instrumento distinto del canonico. MEDIDO con el mismo commit y el mismo .coverage.rc, unica variable el hook .pth de scripts/coverage.sh: cli/commands/runs.py 39 % frente a 88 %, cli/runner.py 55 % frente a 79 %, cli/support.py 69 % frente a 86 %, TOTAL 90.79 % frente a 95.22 %. El dato que lo hace incontestable: cli/support.py mide 69 %, y el suelo que declara el propio AGENTS 6.3 para la CLI es 70 % — el gate mas cercano al push podia dar VERDE un paquete que no cumplia el suelo declarado, y no ejecutaba ninguno de los cuatro contratos exigibles. LO QUE DECIAN Y LO QUE HACIAN: el pre-push afirmaba que «el CI solo verifica que la ejecucion es reproducible», un mundo anterior a WI-98; el pre-commit afirmaba ser un smoke de ~10 s y seleccionaba los .py staged SIN pasarselos — MEDIDO 2636 tests en 124.29 s. El selector existia; la instruccion no. CAMBIOS: pre-push DELEGA en scripts/ci.sh, que es el dueno de COMO se llega a la receta (resuelve mise trust y .pipelinek/); pre-commit hace el smoke de verdad (0.83 s). C4 SE AFINA a «pytest SOBRE EL REPO ENTERO» y DIRECTORIOS_NO_RECETA DESAPARECE: un hook que filtra por paths no emite veredicto sobre el repo y queda fuera sin una lista que lo diga. Una propiedad que hay que mantener al dia no es una propiedad, es una suscripcion. DOS FALLOS DEL PROPIO GUARD, y ninguno lo encontro un test. (1) El guard NO VEIA LOS HOOKS: rglob(*.sh) no los encuentra porque no tienen extension —se llaman asi porque git los busca—, y el invariante daba verde sin haberlos mirado nunca. Es la SEGUNDA vez en este bloque: en WI-99, al inventariar, el inventario con grep de terminacion .sh dejo fuera los dos hooks y no me di cuenta hasta que conte cinco scripts donde habia siete. Un guard que solo descubre una sintaxis no vigila la otra. (2) Un echo de diagnostico con pytest y $STAGED_PY contaba como invocacion, y C4 llevaba DOS COMMITS DANDO VERDE POR EL MOTIVO EQUIVOCADO. La regla correcta es que comando LANZA la linea, no que palabra hay antes de pytest: en ese echo la palabra anterior es smoke:, no echo, asi que la regla de proximidad tampoco servia. Se decide por el primer token no estructural, y si es un verbo de shell que no ejecuta programas la linea no puede estar invocando pytest. Es una lista de PALABRAS del lenguaje, no de ficheros del repo: a diferencia de la lista de excepciones de WI-99, no se desactualiza cuando el repo crece. Ademas pytest src/ —un directorio— tambien selecciona: reconocer solo ficheros .py hacia que un directorio se contara como suite entera, el falso verde opuesto. Siete guards de CADENA del pre-push pasan a medir PROPIEDAD, y dos de ellos EJECUTAN el hook sobre un repo de prueba con un scripts/ci.sh stub que falla si se invoca: la primera vez que tests/test_hooks_system.py comprueba comportamiento y no forma. Mutaciones 10/10. M4 es la mas representativa de la serie: el hook SIGUE DICIENDO HOOK_SKIP_PUSH_TESTS en la cabecera, asi que el guard de cadena de WI-99 la habria aprobado. M7 es la que encontro el falso positivo del echo: sin ella el invariante habria dado verde indefinidamente por el motivo equivocado. 2647 passed en la CI canonica, run 8ccd1f6a-6477-4ad6-9dd9-02e5cd59ebb7, 0 StepFailed, cobertura 95.22 %. Sin push."
  rationale_wi99: "Bloque WI-99. SemVer derivado del historial: 1 feat, 3 fix, 3 test/docs/chore, 0 breaking => MINOR. CALCULA scripts/derive_semver.py: b/f/x/n/d 0/1/3/3/0. scripts/audit_bundle.sh EXISTE PARA DAR EVIDENCIA REPRODUCIBLE A UNA AUDITORIA INDEPENDIENTE, Y LA MEDICION DIJO QUE NO LO ERA. Mismo commit 504b65d: 2625 passed en el arbol de trabajo, 2 failed + 2623 passed en un clon limpio. El guard que fallaba es el de H9, y su mensaje literal es «afirmacion sin respaldo»: un guard que dice la verdad y falla donde se audita. TRES CAUSAS, LAS TRES MEDIDAS ANTES DE TOCAR NADA. (1) .gitignore: el patron docs/* tapaba la evidencia que el codigo referencia. STATE.yaml declaraba dos entregables de H9 CUMPLIDOS con documentos que no estaban versionados; de 150 referencias con forma de fichero, 3 no versionadas, 1 inexistente (anotada como irrecuperable — NO se invento el testigo), 3 bajo external/ (correcto) y 1 plantilla. Se REESCRIBIO el .gitignore separando evidencia de material de trabajo, y se versionaron los tres documentos. Versionar la evidencia en vez de degradar el estado del entregable: un entregable cuya evidencia no esta en el repo no esta cumplido. (2) scripts/ci.sh ERA UNA CUARTA RECETA: 3 stages, 0 contratos exigibles, cli/commands/runs.py al 39 % frente al 87.96 % de la instrumentada — y scripts/audit_bundle.sh la invocaba, es decir el instrumento que existe para medir media con el que no ve. Ahora DELEGA en .pipeline.kts, y arreglar una vez arregla las dos cosas. (3) EL COMANDO CANONICO NO ARRANCABA EN UN CLON NUEVO: mise no ejecuta las herramientas de un checkout en el que no confia (Trust them with `mise trust`), y pipelinek ABRE EL FICHERO SQLite, no el directorio que lo contiene (java.sql.SQLException). El .gitignore pasaba a ignorar el CONTENIDO de .pipelinek/ y se versiona un .gitkeep. Misma categoria que las diez rutas absolutas que WI-98 elimino de .pipeline.kts: una regla que no se puede cumplir fuera de esta maquina no es un contrato, es una costumbre. C4, EL INVARIANTE QUE IMPIDE LA RECAIDA: un script de scripts/ que ejecuta pytest tiene que ser un FRAGMENTO de la receta canonica o DELEGAR en ella. Disyuntiva a proposito: la version restrictiva hace del propio fichero de cobertura una infraccion y su unica salida es una lista de excepciones que el guard mantiene. Los fragmentos se LEEN de .pipeline.kts; los scripts se DESCUBREN por extension; se buscan ORDENES, no lineas (la invocacion real esta partida con barras invertidas); los comentarios se ignoran con la regla de marca-al-inicio-o-tras-espacio, que es la misma para YAML y para shell y ahora es una funcion y no dos. LIMITE DECLARADO: un script que si delega podria ejecutar pytest ademas en su camino certificante y seguir cumpliendo; verlo exigiria un parser de flujo de bash. 11 tests nuevos. MUTACIONES 6/6, y M1 restaura el scripts/ci.sh REAL de antes de WI-99 sacado de git, porque un contraejemplo inventado demuestra que el test esta bien, no que el guard muerde. M6 —que amplia la exclusion hasta tapar scripts/— no pone rojo el checker sino EL TEST QUE FIJA LA EXCLUSION: un guard que se puede silenciar a si mismo no esta verificado. CIERRE: bundle sobre 984289d en clon limpio, Pipeline finished with SUCCESS, 8/8 stages, 2636 passed in 239.26s, cobertura 95.22 %, PASS=16 FAIL=0 BLOCKED=0. DIVERGENCIA 0 EN EL COMMIT 984289d (2636 arbol, 2636 clon). IMPORTANTE: esa medicion es ANTERIOR a la trazabilidad de este bloque, y la PRIMERA CI CANONICA sobre el estado final dio 2 failed + 2634 passed: el tag v0.20.0 no estaba en release.releases y el bloque vivo de CURRENT.md no citaba ninguna linea verificable. Dos guards que ya existian los atraparon. Escribir «divergencia 0» como propiedad del estado final era una afirmacion que nadie habia medido: la reproducibilidad hay que certificarla DESPUES de escribir la certificacion. Corregido y re-medido. Sin push."
  rationale_wi98: "Bloque WI-98. SemVer derivado del historial: 1 feat, 2 fix, 3 test/docs, 0 breaking => MINOR. CALCULA scripts/derive_semver.py: b/f/x/n/d 0/1/2/3/0. AGENTS.md DECLARABA QUE EL RUNNER REMOTO DEBE INVOCAR EL MISMO .pipeline.kts; NO LO HACIA Y ADEMAS NO PODIA. Medido: de los 8 stages canonicos el remoto ejecutaba UNO (lint) y ninguno de los contratos exigibles; con el MISMO instrumento (check_coverage_floors.py) cli/commands/runs.py media 39 % frente a 87.96 % de la canonica, y cli/support.py 69 % — por debajo del suelo del 70 % que declara el propio AGENTS.md 6.3. El remoto podia dar VERDE un paquete que no cumplia su propio contrato. La regla era ademas INEJECUTABLE: .pipeline.kts llevaba diez rutas absolutas a /var/mnt/..., y se demuestra portable (el motor v0.39.0 SI propaga el entorno a los sh(); medido en los dos sentidos). scripts/check_ci_recipe_parity.py, stage ci-parity, CUARTO contrato exigible y el primero que vigila a los otros tres. NUEVE tests que buscaban CADENAS en ci.yml quedan sustituidos por ocho que miden PROPIEDADES. El guard mismo cayo en la trampa que viene a cerrar: las cinco primeras mutaciones dieron rc=0 porque C1 buscaba la cadena en el contenido entero —y la encuentra en un comentario que explica que se usa— y C2 buscaba rutas absolutas solo dentro de sh(...), sin verlas cuando estan en una val de Kotlin, que es justo donde se mueven para arreglar el problema. Un invariante que solo mira una sintaxis concreta se esquiva cambiando de sintaxis. El script de mutaciones tambien estaba mal (mktemp pasa por un wrapper que manda el fichero a la papelera, y las mutaciones no degradaban el bloque multilinea): un contraejemplo que no degrada nada no prueba que el guard funcione. 5/5 mutaciones cazadas con restauracion byte-identica. 2625 passed. Sin push."
  rationale_wi97: "Bloque WI-97. SemVer derivado del historial: 1 feat, 3 fix, 4 test/docs, 0 breaking => MINOR. CALCULA scripts/derive_semver.py: b/f/x/n/d 0/1/3/4/0. EL ULTIMO ESLABON DE LA CADENA DE RELEASE NO SE EJECUTABA NUNCA. git -> __version__ -> pyproject (hatch) -> wheel/sdist: pyproject declara cinco contratos de empaquetado y ninguno lo comprobaba ninguna herramienta. MEDIDO, y la premisa del bloque resulto FALSA: el build NO estaba roto. uv build tarda 1.7 s, produce un wheel de 248 KB con los 80 modulos, instala en venv limpio y 'skillgraph --help' responde. El hueco no era que nada funcionara: es que nadie lo miraba nunca. Cero tests referenciaban hatchling/uv build/entry_points; los 6 stages de .pipeline.kts no construian nada. scripts/check_package_build.py separa la CAPA PURA (evaluar_* sobre InformeBuild, sin disco ni reloj) de la de efecto: esa separacion permite construir contraejemplos con informes sinteticos, que si no exigirian mutar el arbol de trabajo. LO QUE EL CHECKER ENCONTRO AL EJECUTARSE: (1) el sdist declaraba nueve rutas y llevaba catorce — el 'include' de hatchling es un filtro, no lista blanca, y bench/ y docs/ viajaban sin declararse; cambiando un patron se colaba tambien audits/. Corregido a only-include, que si es lista blanca; el conjunto que viaja no cambia. (2) La invariante que mas importa es sg_build_sdist_no_versionado: el artefacto no puede llevar nada que git no versiona, porque un sdist que hereda del arbol de trabajo hace que dos arboles con el mismo commit produzcan dos artefactos distintos y git deja de poder decir que se publico. (3) Un pytest.skip en test_cli_uat.py era una rama que NUNCA se tomaba (el snapshot esta versionado) y llevaba pragma: no cover; verificado con un contraejemplo real — moviendo el fichero, el test pasa de saltarse a fallar. DOS INVARIANTES NACIERON DE LAS MUTACIONES, NO AL REVES: la primera pasada cazó 5 de 7. Comparar lo declarado con lo publicado es tautologia a medias (lo publicado SE DERIVA de lo declarado, asi que un target equivocado sale identico en los dos lados) y una lista mas corta no contradice a nada (no es una promesa rota: es una promesa RETIRADA). Las otras dos mutaciones no cazadas eran mutaciones INVALIDAS, no fallos del contrato: quitar el include del wheel no cambia el artefacto y declarar audits es correcto porque audits si esta versionado. M6 (revertir only-include a include) hace saltar sg_build_sdist_sin_declarar: es la prueba de que el cambio a lista blanca no era cosmetico. 38 tests, mutaciones 7/7. CI canonica 7/7 stages (stage nuevo package-build), run c7c5790a-e532-46f9-a712-9b8996a81b54, 0 StepFailed, '2605 passed in 236.22s'. Sin push."
  rationale_wi93: "Bloque WI-93 (2 commits de trabajo: 66be602 los tests de http_adapter y 3866454 el gate de CI, mas 1 fix de gobernanza). SemVer derivado del historial: 0 feat, 0 breaking, 1 fix, 2 test, 3 docs, 1 chore => PATCH. EL REPO DECLARABA DOS CONTRATOS DE COBERTURA Y LA CI NO COMPROBABA NINGUNO. Uno: pyproject.toml [tool.coverage.report] fail_under = 80, que `coverage report` si comprueba, pero solo si alguien invoca scripts/coverage.sh a mano — la pipeline no tenia stage de cobertura. Dos: AGENTS.md 6.3, suelos POR MODULO (core >=90 %, CLI >=70 %, paths.py >=60 %) que `coverage report` NO PUEDE expresar porque solo admite un umbral global. Ese segundo contrato no lo comprobaba ninguna herramienta del repo. LA PREMISA HEREDADA, MEDIDA: scripts/coverage.sh excluia la cobertura de la CI a proposito con un motivo escrito en su cabecera — «la instrumentacion de subproceso multiplica el tiempo de suite». Decision documentada, no descuido, pero su motivo era una afirmacion sin medir. MEDIDO dos veces en el mismo arbol: pytest a pelo ~110 s frente a la receta completa 203 s, delta +93 s (~1.85x). NO multiplica: cuesta un minuto y medio mas. Y sin el hook .pth el CLI que la suite lanza por subproceso mide 65.86 % en vez de 94 %, o sea que el numero sin instrumentar es ceguera del instrumento, no una medicion. EL HUECO REAL QUE ENCONTRO EL CHECKER: runtime/http_adapter.py media 88.04 %, por debajo del 90 % que le toca por ser modulo del core. Sus 19 sentencias sin cubrir eran guardas alcanzables, y el modulo trae failpoints y `client` inyectable justamente para probarlas sin red; los tests de red existentes usan respx con cliente inyectado, y por eso la rama de produccion que construye su propio httpx.Timeout no la tocaba nadie. MEDIDO DESPUES: 88.04 % -> 99 % (solo queda la linea 424, que el propio codigo marca como defensiva e inalcanzable), runtime/ agregado 95.11 % -> 97.98 %, global 94.75 % -> 95.22 %. 30 tests nuevos. DECISIONES DEL CHECKER (scripts/check_coverage_floors.py): agrega RECUENTOS y no porcentajes, porque con branch=true una rama parcial cuenta como media y promediar porcentajes da mas de lo que hay (un paquete al 95 % de media puede esconder un modulo al 60 %); un suelo sobre un modulo fantasma es un FALLO y no un silencio; los modulos vacios quedan excluidos por division por cero; y exige suelo para todo modulo de runtime/ CON CODIGO, porque un guard que solo vigila la lista que el mismo mantiene no vigila nada. DECISION DE ALCANCE, escrita como tal y no como cita literal de 6.3: se eligio la lectura ESTRICTA —todo modulo de runtime/ hereda el 90 %— porque es la que hace util el contrato y la que encuentra el hueco. CI: .pipeline.kts pasa a 6 stages; unit-tests corre la RECETA en vez de pytest a pelo, de modo que UNA sola pasada hace tests y cobertura (correr pytest dos veces costaria 110+203 s), y hay un stage nuevo coverage-floors que ejecuta el checker. Mutaciones del checker 3/3 con baseline y control final byte-identico. 2529 passed, ruff y format limpios. Sin push."
