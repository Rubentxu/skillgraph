        falta de codigo: «resource/controller API estable» porque skillgraph.core no
        declaraba __all__, y «CLI estable» porque no existia el snapshot de la CLI y once
        comandos de primer nivel podian cambiar sin que nada lo notara. SemVer DERIVADO con
        scripts/derive_semver.py desde v0.28.1: b/f/x/n/d 0/1/0/4/0, la regla pide MINOR. El
        `fix(core)` es el que aporta el valor, y conviene decirlo porque un PATCH suena a
        menor: sin el, dos propiedades seguian siendo IN-CERTIFICABLES. MEDIDO con
