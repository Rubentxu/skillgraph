[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "skillgraph"
dynamic = ["version"]
description = "Plataforma local-first para convertir skills de agentes en workflows declarativos, verificables y extensibles."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "SkillGraph" }]
keywords = ["agents", "workflows", "declarative", "local-first", "markdown", "yaml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://example.invalid/skillgraph"
Issues = "https://example.invalid/skillgraph/issues"

[project.scripts]
skillgraph = "skillgraph.cli:main"

# PEP 735: grupos de dependencias dev/test/docs. uv y pip>=25 los respetan.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6",
    "ruff>=0.6",
]
docs = []

[tool.hatch.version]
path = "src/skillgraph/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/skillgraph"]
include = ["src/skillgraph/py.typed"]

[tool.hatch.build.targets.sdist]
include = [
    "src/skillgraph",
    "tests",
    "pyproject.toml",
    "mise.toml",
    "uv.lock",
    "README.md",
    "CURRENT.md",
    "STATE.yaml",
    "SESSION-JOURNAL.md",
]

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
markers = [
    "spike: experimentos delimitados que validan hipótesis arquitectónicas",
    "etapa1: recorrido de la Etapa 1 del roadmap (CLI + SQLite + catálogo)",
    "slow: tests que tocan disco o red",
]

[tool.coverage.run]
branch = true
source = ["skillgraph"]
omit = [
    "src/skillgraph/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
skip_empty = true
fail_under = 0

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"src/skillgraph/__init__.py" = ["RUF067"]

[tool.ruff.format]
docstring-code-format = true