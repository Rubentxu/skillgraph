# Toolchain versionado para SkillGraph.
# Cumple el blueprint ("Python 3.11 o posterior") y la decisión del operador
# ("versión de Python más actual pero estable").
#
# Activar en la sesión con `mise install` y luego `mise use`.
# NO requiere shims globales: mise escribe su propio PATH al activar.

[env]
_.python.venv = { path = ".venv", create = true }
MISE_PYTHON_COMPILE = "0"     # usar solo binarios precompilados, evita compilar

[tools]
python = "3.13.15"
uv = "0.12.17"
# Canon de AGENTS.md ("CI Local Obligatorio -- pipelinek"). Sin este pin,
# el `pipelinek` del PATH resuelve al shim de asdf 0.43.0 (otro gestor de
# tools), que produjo veredictos NO confiables en el bake-off. Verificado
# 0.39.0 con run real el 2026-10-02: 1880 passed in 86.12s, lint OK,
# 5/5 stages, "Pipeline finished with SUCCESS", cero StepFailed.
# El id debe ser el backend completo: `mise ls --installed` lo registra como
# `github:Rubentxu/pipeline-kotlin`; un `pipelinek = "0.39.0"` suelto crea
# una entrada distinta que queda (missing) y rompe `mise exec -- pipelinek`.
# Evidencia: evidence/pipelinek-bakeoff-2026-10-02.md
"github:Rubentxu/pipeline-kotlin" = "0.39.0"

[settings]
experimental = true

[tasks.sync]
run = "uv sync --group dev"
description = "Resuelve el venv local con dependencias de producción y dev (PEP 735)"

[tasks.release-gate]
run = "uv run pytest tests/test_release_governance.py -v"
description = "Ejecuta el admission gate de release (test_release_governance)"

[tasks.test]
run = "uv run pytest"
description = "Ejecuta la suite de tests focalizados"

[tasks.test-fast]
run = "uv run pytest -x --tb=short"
description = "Suite completa con abort en primer fallo y traceback corto (iteracion RED/GREEN)"

[tasks.test-cov]
run = "uv run pytest --cov=skillgraph --cov-report=term-missing"
description = "Suite con cobertura local (no genera XML)"

[tasks.lint]
run = "uv run ruff check src tests"
description = "Lint rápido (Ruff, E/F/I/B/UP/SIM/RUF)"

[tasks.format]
run = "uv run ruff format src tests"
description = "Formato (Ruff, line-length 100)"

[tasks.cli]
run = "uv run skillgraph --version"
description = "Smoke test de la CLI instalada en el venv"