        13 PASS / 6 OPEN / 1 NO_MEASURABLE -> 15 PASS / 4 OPEN / 1 NO_MEASURABLE. La cuenta
        intermedia fue 14/5, y el OPEN que sobraba era «roadmap/state/docs coherentes»,
        que es precisamente el tests.total: se puso al final del bloque con el run ejecutado
