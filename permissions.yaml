# Registro de permisos de agentes (SDDK).
#
# Formato verificado empiricamente el 2026-09-28 con
# `sddk permission check`, no deducido de la documentacion.
#
# Default-deny es real: un registro ausente o vacio deniega todo. Este
# archivo no es decorativo, es lo que permite que `sddk release apply`
# supere la lectura del registry. Ver
# `evidence/permissions-registry-schema.md` para la determinacion.
#
# La clave es `capabilities`, no `allowed_capabilities`. Con la clave
# equivocada el chequeo devuelve `allowed: false` sin avisar.
#
# `phases` es restrictivo y se verifica: con `phases: [apply]`, pedir la
# misma capacidad en `release` o `archive` devuelve `allowed: false`.
# Por eso el permiso de release se declara para la fase `release` y no
# para `apply`.

agents:
  apply-agent:
    phases: [apply]
    capabilities:
      - core.workflow-orchestration@v1
      - core.contract-review@v1

  # El actor real de la Push Discipline: `release permission denied:
  # agent sddk-release is not declared in the permission registry`. El
  # nombre lo dicta el binario, no una suposicion.
  sddk-release:
    phases: [release]
    capabilities:
      - core.release-planning@v1
      - git.inspect
      - git.tag
      - git.push

  # El orquestador cierra ciclos. Sin esto, `wi-04-housekeeping-traceability`
  # quedo BLOCKED desde 2026-09-26 por un `approval.capability.requested`
  # de `surface.cycle_state#cycle_supersede` que expiro a las 17:57 sin
  # respuesta. El trabajo ya habia salido como v0.14.5; lo que faltaba era
  # solo registrar el cierre.
  #
  # `surface.cycle_state` es de solo lectura sobre el estado del ciclo.
  # `cycle_supersede` cierra con sucesor o con razon, ambas append-only.
  # No concede escritura de artefactos ni acceso a git.
  sddk-orchestrator:
    phases: [explore, specify, design, tasks, apply, verify, release, archive]
    capabilities:
      - surface.cycle_state#cycle_supersede
      - core.workflow-orchestration@v1
