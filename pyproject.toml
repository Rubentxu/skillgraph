[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "skillgraph"
dynamic = ["version"]
description = "Plataforma local-first para convertir skills de agentes en workflows declarativos, verificables y extensibles."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "SkillGraph" }]
keywords = ["agents", "workflows", "declarative", "local-first", "markdown", "yaml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "PyYAML>=6.0",
    "httpx>=0.27,<1.0",  # WI-12 E1 Adapter real (HTTP genérico para Anthropic + OpenAI)
]

[project.optional-dependencies]
git = ["dulwich>=0.21,<1.0"]

[project.urls]
Homepage = "https://example.invalid/skillgraph"
Issues = "https://example.invalid/skillgraph/issues"

[project.scripts]
skillgraph = "skillgraph.cli:main"

# PEP 735: grupos de dependencias dev/test/docs. uv y pip>=25 los respetan.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6",
    "ruff>=0.6",
    "dulwich>=0.21",  # Slice 3+ (git fingerprinting)
    "respx>=0.21,<1.0",  # WI-12 E1 Adapter real (mock HTTP transport-level)
]
docs = []

[tool.hatch.version]
path = "src/skillgraph/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/skillgraph"]
include = ["src/skillgraph/py.typed"]

[tool.hatch.build.targets.sdist]
# `only-include`, no `include` (WI-97).
#
# `include` es un FILTRO, no una lista blanca: lo que no nombra se cuela si
# no lo detiene el `.gitignore`. Medido con la lista de nueve entradas de
# antes, el sdist salia con catorce rutas de primer nivel: `bench/` y `docs/`
# viajaban sin estar declaradas, y cambiando un solo patron se colaba
# tambien `audits/`. `only-include` si es lista blanca.
#
# `bench/` y `docs/blueprint` se declaran explicitamente porque son fuentes de
# desarrollo legitimas de un sdist: la suite versionada lee
# `docs/blueprint/plan/UAT.md` (ver tests/test_cli_uat.py) y `bench/` es el
# codigo de rendimiento del proyecto. Lo que no puede viajar es lo que git
# no versiona — de eso se encarga `scripts/check_package_build.py`.
only-include = [
    "src/skillgraph",
    "tests",
    "bench",
    "docs/blueprint",
    "pyproject.toml",
    "mise.toml",
    "uv.lock",
    "README.md",
    "CURRENT.md",
    "STATE.yaml",
    "SESSION-JOURNAL.md",
]

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
markers = [
    "spike: experimentos delimitados que validan hipótesis arquitectónicas",
    "etapa1: recorrido de la Etapa 1 del roadmap (CLI + SQLite + catálogo)",
    "slow: tests que tocan disco o red",
]

[tool.coverage.run]
branch = true
source = ["skillgraph"]
# NOTA (WI-75, cierra la deuda que WI-63 dejo abierta):
# esta config mide el PROCESO PRINCIPAL. `pytest --cov=skillgraph` NO ve
# el CLI ejecutado por subproceso (`python -m skillgraph ...`), que es
# como la suite ejercita la frontera CLI. Con esta config el CLI total
# daba 65.86 % — por debajo del contrato de AGENTS.md §6.3 (>=70 %) — y
# era CEGUERA DEL INSTRUMENTO, no deuda de tests: con la instrumentacion
# correcta el mismo codigo mide 94 %.
#
# Para medirlo bien usa `bash scripts/coverage.sh`, que arregla las tres
# piezas (hook .pth que llama a coverage.process_startup(), parallel=true
# para que los procesos no se pisen, y data_file ABSOLUTO porque los
# tests lanzan la CLI con cwd=tmp_path). Ver SESSION-JOURNAL 2026-10-02
# y evidence/sddk-wi75-verify-2026-10-02.md.
omit = [
    "src/skillgraph/__init__.py",
    "src/skillgraph/__main__.py",
    "src/skillgraph/cli/runner.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
skip_empty = true
fail_under = 80

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# Sin esto, ruff parte un bloque `X as X` (la forma de reexport
# intencional que F401 respeta) en una sentencia por nombre: doce lineas
# para los doce codigos de salida de la CLI. Medido en WI-88, ADR-0016.
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"src/skillgraph/__init__.py" = ["RUF067"]

[tool.ruff.format]
docstring-code-format = true